<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">무선통신: 단말의 비트에서 서버의 응답까지</title><desc id="desc">단말과 RAN 사이 전파 구간 뒤로 UPF와 IP망을 지나 서버가 연결된다. 아래에는 AI-RAN의 세 목적을 구분한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="100%" fill="#f8fafc"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#0f172a">
<text x="40" y="52" font-size="29" font-weight="700">무선통신: 단말의 비트에서 서버의 응답까지</text>
<text x="40" y="93" font-size="17" fill="#334155" font-weight="400" text-anchor="start">실선은 사용자 데이터의 개념 경로다. 제어·설정 객체는 별도의 경로로 연결된다.</text>
<rect x="40" y="160" width="240" height="150" rx="15" fill="#dbeafe" stroke="#94a3b8"/>
<text x="56" y="190" font-size="20" fill="#334155" font-weight="700" text-anchor="start">단말 UE</text>
<text x="56" y="221" font-size="15" fill="#334155" font-weight="400" text-anchor="start">앱의 비트</text>
<text x="56" y="242" font-size="15" fill="#334155" font-weight="400" text-anchor="start">무선 신호로 변환</text>
<line x1="280" y1="235" x2="320" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="320" y="160" width="240" height="150" rx="15" fill="#dbeafe" stroke="#94a3b8"/>
<text x="336" y="190" font-size="20" fill="#334155" font-weight="700" text-anchor="start">RAN</text>
<text x="336" y="221" font-size="15" fill="#334155" font-weight="400" text-anchor="start">RU·DU·CU</text>
<text x="336" y="242" font-size="15" fill="#334155" font-weight="400" text-anchor="start">무선 수신과 처리</text>
<line x1="560" y1="235" x2="600" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="600" y="160" width="240" height="150" rx="15" fill="#dcfce7" stroke="#94a3b8"/>
<text x="616" y="190" font-size="20" fill="#334155" font-weight="700" text-anchor="start">core·UPF</text>
<text x="616" y="221" font-size="15" fill="#334155" font-weight="400" text-anchor="start">사용자 데이터 전달</text>
<text x="616" y="242" font-size="15" fill="#334155" font-weight="400" text-anchor="start">IP망으로 연결</text>
<line x1="840" y1="235" x2="880" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="880" y="160" width="240" height="150" rx="15" fill="#dcfce7" stroke="#94a3b8"/>
<text x="896" y="190" font-size="20" fill="#334155" font-weight="700" text-anchor="start">서버</text>
<text x="896" y="221" font-size="15" fill="#334155" font-weight="400" text-anchor="start">HTTP·AI 서비스</text>
<text x="896" y="242" font-size="15" fill="#334155" font-weight="400" text-anchor="start">결과를 단말로 응답</text>
<text x="286" y="145" font-size="16" fill="#334155" font-weight="400" text-anchor="start">전파 구간</text>
<rect x="40" y="400" width="340" height="175" rx="15" fill="#ede9fe" stroke="#94a3b8"/>
<text x="56" y="430" font-size="20" fill="#334155" font-weight="700" text-anchor="start">AI-for-RAN</text>
<text x="56" y="461" font-size="15" fill="#334155" font-weight="400" text-anchor="start">무선망 자체를 개선</text>
<text x="56" y="482" font-size="15" fill="#334155" font-weight="400" text-anchor="start">예: 채널 예측·자원 최적화</text>
<rect x="430" y="400" width="340" height="175" rx="15" fill="#fef3c7" stroke="#94a3b8"/>
<text x="446" y="430" font-size="20" fill="#334155" font-weight="700" text-anchor="start">AI-and-RAN</text>
<text x="446" y="461" font-size="15" fill="#334155" font-weight="400" text-anchor="start">RAN과 AI 계산 기반 공유</text>
<text x="446" y="482" font-size="15" fill="#334155" font-weight="400" text-anchor="start">예: GPU 시간·메모리 예산</text>
<rect x="820" y="400" width="340" height="175" rx="15" fill="#dcfce7" stroke="#94a3b8"/>
<text x="836" y="430" font-size="20" fill="#334155" font-weight="700" text-anchor="start">AI-on-RAN</text>
<text x="836" y="461" font-size="15" fill="#334155" font-weight="400" text-anchor="start">무선망 가까운 AI 서비스</text>
<text x="836" y="482" font-size="15" fill="#334155" font-weight="400" text-anchor="start">예: 영상·언어 모델의 추론</text>
<text x="40" y="645" font-size="17" fill="#334155" font-weight="400" text-anchor="start">AI-RAN은 하나의 새 전파 규격명이 아니다. 전파·패킷·제어·서버 계산의 위치를 함께 읽는다.</text>
</g></svg>
