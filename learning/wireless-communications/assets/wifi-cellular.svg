<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Wi-Fi와 이동통신: 같은 공기의 공유</title><desc id="desc">Wi-Fi에서는 경쟁 기반 채널 접근을 사용하며 일부 절차는 AP가 조정한다. 이동통신에서는 접속 뒤 기지국의 grant에 따라 자원을 사용한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="100%" fill="#f8fafc"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#0f172a">
<text x="40" y="52" font-size="29" font-weight="700">Wi-Fi와 이동통신: 같은 공기의 공유</text>
<rect x="40" y="150" width="520" height="155" rx="15" fill="#dbeafe" stroke="#94a3b8"/>
<text x="56" y="180" font-size="20" fill="#334155" font-weight="700" text-anchor="start">Wi-Fi의 경쟁 기반 접근</text>
<text x="56" y="211" font-size="15" fill="#334155" font-weight="400" text-anchor="start">채널 감지 → backoff → 송신 → ACK</text>
<text x="56" y="232" font-size="15" fill="#334155" font-weight="400" text-anchor="start">충돌·hidden node로 재시도할 수 있음</text>
<rect x="640" y="150" width="520" height="155" rx="15" fill="#dcfce7" stroke="#94a3b8"/>
<text x="656" y="180" font-size="20" fill="#334155" font-weight="700" text-anchor="start">이동통신의 자원 배정</text>
<text x="656" y="211" font-size="15" fill="#334155" font-weight="400" text-anchor="start">접속·요청 → 기지국 grant → 데이터</text>
<text x="656" y="232" font-size="15" fill="#334155" font-weight="400" text-anchor="start">기지국이 시간·주파수 자원을 조정</text>
<rect x="40" y="365" width="240" height="160" rx="15" fill="#dbeafe" stroke="#94a3b8"/>
<text x="56" y="395" font-size="20" fill="#334155" font-weight="700" text-anchor="start">단말 A</text>
<text x="56" y="426" font-size="15" fill="#334155" font-weight="400" text-anchor="start">빈 채널 확인</text>
<text x="56" y="447" font-size="15" fill="#334155" font-weight="400" text-anchor="start">backoff 3</text>
<rect x="320" y="365" width="240" height="160" rx="15" fill="#dbeafe" stroke="#94a3b8"/>
<text x="336" y="395" font-size="20" fill="#334155" font-weight="700" text-anchor="start">단말 B</text>
<text x="336" y="426" font-size="15" fill="#334155" font-weight="400" text-anchor="start">채널이 바쁘면</text>
<text x="336" y="447" font-size="15" fill="#334155" font-weight="400" text-anchor="start">counter를 멈춤</text>
<rect x="640" y="365" width="240" height="160" rx="15" fill="#dcfce7" stroke="#94a3b8"/>
<text x="656" y="395" font-size="20" fill="#334155" font-weight="700" text-anchor="start">기지국</text>
<text x="656" y="426" font-size="15" fill="#334155" font-weight="400" text-anchor="start">사용자·채널 고려</text>
<text x="656" y="447" font-size="15" fill="#334155" font-weight="400" text-anchor="start">grant 발행</text>
<rect x="920" y="365" width="240" height="160" rx="15" fill="#dcfce7" stroke="#94a3b8"/>
<text x="936" y="395" font-size="20" fill="#334155" font-weight="700" text-anchor="start">단말</text>
<text x="936" y="426" font-size="15" fill="#334155" font-weight="400" text-anchor="start">할당 자원에서</text>
<text x="936" y="447" font-size="15" fill="#334155" font-weight="400" text-anchor="start">데이터 송신</text>
<line x1="880" y1="445" x2="920" y2="445" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="612" font-size="17" fill="#334155" font-weight="400" text-anchor="start">Wi-Fi의 OFDMA는 AP가 여러 사용자에게 자원을 나눌 수 있다. 이것이 경쟁·채널 공유 문제를 없애지는 않는다.</text>
</g></svg>
