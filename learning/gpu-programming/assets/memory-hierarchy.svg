<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">GPU memory 소유 계층</title><desc id="desc">Thread private register, block shared memory, grid와 host가 수명 관리하는 global memory의 범위</desc><rect width="1200" height="680" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle"><text x="600" y="45" font-size="30">누가 보고 얼마나 오래 사는가</text><rect x="100" y="100" width="1000" height="500" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="600" y="145" font-size="23">Global memory · allocation 수명</text><rect x="190" y="200" width="820" height="320" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="245" font-size="22">Shared memory · 한 block 수명</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="250" y="310" width="200" height="120" rx="14"/><rect x="500" y="310" width="200" height="120" rx="14"/><rect x="750" y="310" width="200" height="120" rx="14"/></g><g font-size="19"><text x="350" y="355">Thread 0</text><text x="350" y="390">Register</text><text x="600" y="355">Thread 1</text><text x="600" y="390">Register</text><text x="850" y="355">Thread 2</text><text x="850" y="390">Register</text></g><text x="600" y="570" font-size="18">Async 작업 completion 전 global buffer를 해제하지 않는다</text></g></svg>
