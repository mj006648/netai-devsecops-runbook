<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Tiled matrix multiplication 단계</title><desc id="desc">Global A와 B tile을 shared memory에 적재하고 block barrier 뒤 thread가 곱셈을 누적한 후 다시 barrier를 거쳐 다음 phase로 가는 흐름</desc><rect width="1200" height="700" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle"><text x="600" y="42" font-size="29">Load → Barrier → Compute → Barrier</text><g stroke-width="2"><rect x="50" y="130" width="240" height="110" rx="14" fill="#dbeafe" stroke="#2563eb"/><text x="170" y="175" font-size="20">Global A/B</text><text x="170" y="207" font-size="17">Thread별 한 값 load</text><rect x="360" y="130" width="240" height="110" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="480" y="175" font-size="20">Shared tile</text><text x="480" y="207" font-size="17">모든 값 준비</text><rect x="670" y="130" width="200" height="110" rx="14" fill="#fef3c7" stroke="#d97706"/><text x="770" y="190" font-size="20">Block barrier</text><rect x="940" y="130" width="210" height="110" rx="14" fill="#f3e8ff" stroke="#9333ea"/><text x="1045" y="175" font-size="20">Register 누적</text><text x="1045" y="207" font-size="17">Dot product</text><rect x="420" y="400" width="360" height="100" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="600" y="438" font-size="20">두 번째 block barrier</text><text x="600" y="470" font-size="17">다음 phase가 tile을 덮기 전 대기</text><rect x="420" y="560" width="360" height="80" rx="14" fill="#e0e7ff" stroke="#4f46e5"/><text x="600" y="608" font-size="20">다음 K tile phase</text></g></g><g stroke="#475569" stroke-width="4" fill="none"><path d="M290 185H360"/><path d="M600 185H670"/><path d="M870 185H940"/><path d="M1045 240L720 400"/><path d="M600 500V560"/><path d="M420 600C180 600 170 300 360 220"/></g></svg>
