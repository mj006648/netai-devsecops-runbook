<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">GPU thread 실행 계층</title><desc id="desc">Grid가 block을, block이 32-lane warp를 포함하고 각 lane이 array index를 계산하는 구조</desc><rect width="1200" height="680" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle"><text x="600" y="45" font-size="30">Grid → Block → Warp → Lane</text><rect x="70" y="90" width="1060" height="520" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="600" y="130" font-size="23">Grid: 한 kernel launch</text><rect x="130" y="170" width="440" height="380" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="350" y="210" font-size="22">Block 0</text><rect x="630" y="170" width="440" height="380" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="850" y="210" font-size="22">Block 1</text><g fill="#dcfce7" stroke="#16a34a" stroke-width="2"><rect x="170" y="250" width="360" height="100" rx="12"/><rect x="170" y="390" width="360" height="100" rx="12"/><rect x="670" y="250" width="360" height="100" rx="12"/><rect x="670" y="390" width="360" height="100" rx="12"/></g><g font-size="19"><text x="350" y="292">Warp 0</text><text x="350" y="323">lane 0..31</text><text x="350" y="432">Warp 1</text><text x="350" y="463">lane 0..31</text><text x="850" y="292">Warp 0</text><text x="850" y="323">lane 0..31</text><text x="850" y="432">Warp 1</text><text x="850" y="463">lane 0..31</text></g><text x="600" y="650" font-size="18">global index = blockIdx × blockDim + threadIdx</text></g></svg>
