<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Stream dependency와 multi-GPU collective</title><desc id="desc">두 stream의 copy와 kernel을 event로 연결하고 네 GPU가 ring all-reduce chunk를 순환하는 구조</desc><rect width="1200" height="700" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle"><text x="600" y="42" font-size="29">비동기 순서와 여러 GPU 통신</text><text x="300" y="92" font-size="22">Stream dependency</text><text x="900" y="92" font-size="22">Ring collective</text><g stroke-width="2"><rect x="50" y="130" width="190" height="80" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="145" y="178" font-size="18">H2D chunk 0</text><rect x="300" y="130" width="190" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="395" y="178" font-size="18">Kernel 0</text><rect x="175" y="280" width="190" height="80" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="270" y="328" font-size="18">Event complete</text><circle cx="900" cy="180" r="58" fill="#e0e7ff" stroke="#4f46e5"/><circle cx="1050" cy="330" r="58" fill="#e0e7ff" stroke="#4f46e5"/><circle cx="900" cy="480" r="58" fill="#e0e7ff" stroke="#4f46e5"/><circle cx="750" cy="330" r="58" fill="#e0e7ff" stroke="#4f46e5"/><text x="900" y="187" font-size="20">GPU 0</text><text x="1050" y="337" font-size="20">GPU 1</text><text x="900" y="487" font-size="20">GPU 2</text><text x="750" y="337" font-size="20">GPU 3</text><rect x="80" y="470" width="430" height="110" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="295" y="510" font-size="19">Buffer 수명</text><text x="295" y="544" font-size="17">Event 전 재사용·해제 금지</text></g></g><g stroke="#475569" stroke-width="4" fill="none"><path d="M240 170H300"/><path d="M395 210L300 280"/><path d="M958 180L1050 272"/><path d="M1050 388L958 480"/><path d="M842 480L750 388"/><path d="M750 272L842 180"/><path d="M270 360L295 470"/></g></svg>
