<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">GPU 프로그래밍 전체 지도</title><desc id="desc">Host CPU가 memory와 stream을 준비하고 GPU grid와 memory가 kernel을 실행한 뒤 결과를 반환하는 흐름</desc><rect width="1200" height="680" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle"><text x="600" y="45" font-size="30">Host에서 GPU 결과까지</text><g stroke-width="3"><rect x="70" y="120" width="280" height="100" rx="16" fill="#dbeafe" stroke="#2563eb"/><text x="210" y="165" font-size="22">Host CPU</text><text x="210" y="195" font-size="17">할당·copy·launch</text><rect x="460" y="120" width="280" height="100" rx="16" fill="#fef3c7" stroke="#d97706"/><text x="600" y="165" font-size="22">Stream·Event</text><text x="600" y="195" font-size="17">순서·completion</text><rect x="850" y="120" width="280" height="100" rx="16" fill="#dcfce7" stroke="#16a34a"/><text x="990" y="165" font-size="22">GPU Grid</text><text x="990" y="195" font-size="17">block·warp·thread</text><rect x="180" y="370" width="360" height="110" rx="16" fill="#e0e7ff" stroke="#4f46e5"/><text x="360" y="415" font-size="22">Device memory</text><text x="360" y="450" font-size="17">global allocation</text><rect x="660" y="370" width="360" height="110" rx="16" fill="#f3e8ff" stroke="#9333ea"/><text x="840" y="415" font-size="22">SM execution</text><text x="840" y="450" font-size="17">register·shared·ALU</text><rect x="390" y="560" width="420" height="80" rx="16" fill="#fee2e2" stroke="#dc2626"/><text x="600" y="608" font-size="21">Result 검증과 buffer 해제</text></g></g><g stroke="#475569" stroke-width="4" fill="none"><path d="M350 170H460"/><path d="M740 170H850"/><path d="M990 220L840 370"/><path d="M850 420H540"/><path d="M360 480L520 560"/><path d="M840 480L680 560"/></g></svg>
