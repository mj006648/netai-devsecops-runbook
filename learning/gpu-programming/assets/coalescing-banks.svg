<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Coalescing sector와 shared bank</title><desc id="desc">32 lane이 4-byte 연속 주소로 128 byte를 읽어 네 32-byte sector를 사용하고 stride 32 shared 주소가 bank 0에 충돌하는 비교</desc><rect width="1200" height="700" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle"><text x="600" y="42" font-size="29">Warp의 실제 주소를 계산한다</text><text x="300" y="95" font-size="22">Global: 32 lane × 4 byte</text><text x="900" y="95" font-size="22">Shared: bank = word mod 32</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="60" y="135" width="120" height="90"/><rect x="180" y="135" width="120" height="90"/><rect x="300" y="135" width="120" height="90"/><rect x="420" y="135" width="120" height="90"/></g><g font-size="17"><text x="120" y="170">Sector 0</text><text x="120" y="198">0..31</text><text x="240" y="170">Sector 1</text><text x="240" y="198">32..63</text><text x="360" y="170">Sector 2</text><text x="360" y="198">64..95</text><text x="480" y="170">Sector 3</text><text x="480" y="198">96..127</text></g><rect x="660" y="135" width="480" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="900" y="170" font-size="19">shared[32 × lane]</text><text x="900" y="200" font-size="18">서로 다른 주소, 모두 bank 0</text><rect x="80" y="315" width="460" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="310" y="355" font-size="20">정렬 base 0: sector 4개</text><text x="310" y="390" font-size="17">주소 0,4,...,124</text><rect x="660" y="315" width="460" height="110" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="890" y="355" font-size="20">같은 주소 read: broadcast</text><text x="890" y="390" font-size="17">shared[5]를 모든 lane이 읽음</text><rect x="250" y="520" width="700" height="100" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="600" y="560" font-size="20">Base 4면 주소 4..131</text><text x="600" y="592" font-size="18">32-byte sector 0..4, 다섯 개</text></g></svg>
