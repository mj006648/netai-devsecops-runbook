<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">GPU 공유: 광고·메모리·실행·격리의 차이</title>
<desc id="desc">네 가지 실행 방식과 DRA의 회계 표현을 비교한다. 제품별 지원·profile·gate는 본문을 따른다. 교육 예: 24 GiB GPU의 time-slicing replica 4가 각각 독립 6 GiB VRAM을 보장하는 것은 아니다. 같은 GPU를 두 allocator가 독립 free inventory로 광고하면 중복 배정 위험이 있다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect width="1200" height="870" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
<text x="40" y="54" font-size="30" font-weight="700" fill="#0f172a">GPU 공유: 광고·메모리·실행·격리의 차이</text>
<text x="40" y="92" font-size="17" fill="#475569">네 가지 실행 방식과 DRA의 회계 표현을 비교한다. 제품별 지원·profile·gate는 본문을 따른다.</text>
<rect x="40" y="140" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="140" width="500" height="48" rx="14" fill="#dbeafe"/>
<rect x="40" y="167" width="500" height="21" fill="#dbeafe"/>
<text x="58" y="172" font-size="21" font-weight="700" fill="#1e40af">1. Whole GPU</text>
<text x="60" y="218" font-size="17" fill="#334155">일반적인 장치 하나 독점 배정</text>
<text x="60" y="242" font-size="17" fill="#334155">물리 장치와 할당 단위 확인</text>
<text x="60" y="266" font-size="17" fill="#334155">GPU 두 장이 VRAM 자동 합산은 아님</text>
<rect x="660" y="140" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="140" width="500" height="48" rx="14" fill="#dbeafe"/>
<rect x="660" y="167" width="500" height="21" fill="#dbeafe"/>
<text x="678" y="172" font-size="21" font-weight="700" fill="#1e40af">2. MIG</text>
<text x="680" y="218" font-size="17" fill="#334155">지원 hardware의 instance 분할</text>
<text x="680" y="242" font-size="17" fill="#334155">profile별 계산·memory·fault 경계</text>
<text x="680" y="266" font-size="17" fill="#334155">기존 instance 할당과 DynamicMIG는 별도</text>
<rect x="40" y="370" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="370" width="500" height="48" rx="14" fill="#ccfbf1"/>
<rect x="40" y="397" width="500" height="21" fill="#ccfbf1"/>
<text x="58" y="402" font-size="21" font-weight="700" fill="#115e59">3. Time-slicing</text>
<text x="60" y="448" font-size="17" fill="#334155">여러 process가 실행 시간을 공유</text>
<text x="60" y="472" font-size="17" fill="#334155">Replica 수가 물리 GPU 수는 아님</text>
<text x="60" y="496" font-size="17" fill="#334155">독립 VRAM·fault isolation 없음</text>
<rect x="660" y="370" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="370" width="500" height="48" rx="14" fill="#ccfbf1"/>
<rect x="660" y="397" width="500" height="21" fill="#ccfbf1"/>
<text x="678" y="402" font-size="21" font-weight="700" fill="#115e59">4. MPS</text>
<text x="680" y="448" font-size="17" fill="#334155">CUDA process 실행을 daemon으로 공유</text>
<text x="680" y="472" font-size="17" fill="#334155">설정된 memory·compute 제한 조건</text>
<text x="680" y="496" font-size="17" fill="#334155">MIG의 hardware 경계와 같지 않음</text>
<rect x="40" y="600" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="600" width="500" height="48" rx="14" fill="#ede9fe"/>
<rect x="40" y="627" width="500" height="21" fill="#ede9fe"/>
<text x="58" y="632" font-size="21" font-weight="700" fill="#5b21b6">5. DRA Claim 공유</text>
<text x="60" y="678" font-size="17" fill="#334155">한 allocation을 여러 소비자가 참조</text>
<text x="60" y="702" font-size="17" fill="#334155">참조 수가 새 장치 배정 수는 아님</text>
<text x="60" y="726" font-size="17" fill="#334155">공유 memory·실행 조건은 별도</text>
<rect x="660" y="600" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="600" width="500" height="48" rx="14" fill="#ede9fe"/>
<rect x="660" y="627" width="500" height="21" fill="#ede9fe"/>
<text x="678" y="632" font-size="21" font-weight="700" fill="#5b21b6">6. DRA consumable capacity</text>
<text x="680" y="678" font-size="17" fill="#334155">독립 Claim의 광고 용량 소비 회계</text>
<text x="680" y="702" font-size="17" fill="#334155">upstream Beta와 vendor Alpha 구별</text>
<text x="680" y="726" font-size="17" fill="#334155">driver gate·제한·capacity 설정 필요</text>
<text x="40" y="815" font-size="16" fill="#475569">교육 예: 24 GiB GPU의 time-slicing replica 4가 각각 독립 6 GiB VRAM을 보장하는 것은 아니다.</text>
<text x="40" y="838" font-size="16" fill="#475569">같은 GPU를 두 allocator가 독립 free inventory로 광고하면 중복 배정 위험이 있다.</text>
</g>
</svg>
