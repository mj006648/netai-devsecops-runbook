<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">동전 최소 개수 DP 표</title>
  <desc id="desc">동전 1, 3, 4로 금액 0에서 6까지 최소 개수 0,1,2,1,1,2,2를 계산한 표</desc>
  <rect width="960" height="300" fill="#fefce8"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#422006">coins = {1,3,4}</text>
  <g font-family="sans-serif" font-size="19" text-anchor="middle">
    <g fill="#fef9c3" stroke="#ca8a04" stroke-width="2"><rect x="95" y="90" width="110" height="70"/><rect x="205" y="90" width="110" height="70"/><rect x="315" y="90" width="110" height="70"/><rect x="425" y="90" width="110" height="70"/><rect x="535" y="90" width="110" height="70"/><rect x="645" y="90" width="110" height="70"/><rect x="755" y="90" width="110" height="70"/></g>
    <g fill="#422006"><text x="150" y="118">x=0</text><text x="260" y="118">x=1</text><text x="370" y="118">x=2</text><text x="480" y="118">x=3</text><text x="590" y="118">x=4</text><text x="700" y="118">x=5</text><text x="810" y="118">x=6</text><text x="150" y="148">0</text><text x="260" y="148">1</text><text x="370" y="148">2</text><text x="480" y="148">1</text><text x="590" y="148">1</text><text x="700" y="148">2</text><text x="810" y="148">2</text></g>
  </g>
  <text x="480" y="220" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#713f12">dp[6] = 1 + dp[3] = 2 → 3 + 3</text>
  <text x="480" y="255" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#713f12">Greedy 4+1+1은 3개라 최적이 아니다.</text>
</svg>
