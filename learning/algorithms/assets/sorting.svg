<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Stable merge sort</title>
  <desc id="desc">3A와 3C의 상대 순서를 유지하면서 두 정렬 목록을 합치는 과정</desc>
  <rect width="960" height="320" fill="#fff7ed"/>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#431407">
    <text x="480" y="35">[3A, 1B, 3C, 2D]</text><text x="270" y="105">[1B, 3A]</text><text x="690" y="105">[2D, 3C]</text>
    <rect x="270" y="190" width="420" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="480" y="232">[1B, 2D, 3A, 3C]</text><text x="480" y="292" font-size="16">같은 key 3에서 왼쪽 3A를 먼저 선택해 A-before-C 유지</text>
  </g>
  <g stroke="#9a3412" stroke-width="3"><path d="M480 48L290 88"/><path d="M480 48L670 88"/><path d="M290 120L430 190"/><path d="M670 120L530 190"/></g>
</svg>
