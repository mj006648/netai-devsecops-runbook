<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">Join과 AQE: 의미와 실행 전략을 따로 보기</title>
<desc id="desc">같은 join 결과를 만드는 방법도 입력 크기·키 분포·실제 실행 통계에 따라 달라진다. 두 중간 카드의 전략은 대안이다. 같은 join이 반드시 두 전략을 모두 실행한다는 뜻은 아니다. Broadcast는 모든 큰 테이블을 driver로 collect하는 연산과 다르다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#475569"/></marker></defs>
<rect width="1200" height="870" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
<text x="40" y="54" font-size="30" font-weight="700" fill="#0f172a">Join과 AQE: 의미와 실행 전략을 따로 보기</text>
<text x="40" y="92" font-size="17" fill="#475569">같은 join 결과를 만드는 방법도 입력 크기·키 분포·실제 실행 통계에 따라 달라진다.</text>
<rect x="40" y="140" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="140" width="500" height="48" rx="14" fill="#dbeafe"/>
<rect x="40" y="167" width="500" height="21" fill="#dbeafe"/>
<text x="58" y="172" font-size="21" font-weight="700" fill="#1e40af">1. Fact: 센서 측정</text>
<text x="60" y="218" font-size="17" fill="#334155">sensor_id, 시간, 측정 값</text>
<text x="60" y="242" font-size="17" fill="#334155">큰 테이블의 행을 기준 키로 연결</text>
<text x="60" y="266" font-size="17" fill="#334155">키 중복·null·join 종류가 결과를 바꾼다.</text>
<rect x="660" y="140" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="140" width="500" height="48" rx="14" fill="#dbeafe"/>
<rect x="660" y="167" width="500" height="21" fill="#dbeafe"/>
<text x="678" y="172" font-size="21" font-weight="700" fill="#1e40af">2. Dimension: 센서 정보</text>
<text x="680" y="218" font-size="17" fill="#334155">sensor_id, 위치, 모델</text>
<text x="680" y="242" font-size="17" fill="#334155">한 센서에 두 행이면 join 결과가 늘어난다.</text>
<text x="680" y="266" font-size="17" fill="#334155">작다는 판단은 실제 크기와 통계에 의존</text>
<rect x="40" y="370" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="370" width="500" height="48" rx="14" fill="#ccfbf1"/>
<rect x="40" y="397" width="500" height="21" fill="#ccfbf1"/>
<text x="58" y="402" font-size="21" font-weight="700" fill="#115e59">3. Broadcast join</text>
<text x="60" y="448" font-size="17" fill="#334155">작은 쪽을 필요한 executor에 전달</text>
<text x="60" y="472" font-size="17" fill="#334155">큰 쪽의 전체 shuffle을 피할 수 있다.</text>
<text x="60" y="496" font-size="17" fill="#334155">broadcast 메모리·전달 비용은 남는다.</text>
<rect x="660" y="370" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="370" width="500" height="48" rx="14" fill="#ccfbf1"/>
<rect x="660" y="397" width="500" height="21" fill="#ccfbf1"/>
<text x="678" y="402" font-size="21" font-weight="700" fill="#115e59">4. Sort-merge 등 shuffle join</text>
<text x="680" y="448" font-size="17" fill="#334155">양쪽을 join key 기준으로 모은다.</text>
<text x="680" y="472" font-size="17" fill="#334155">정렬·hash 등 선택한 연산을 실행</text>
<text x="680" y="496" font-size="17" fill="#334155">대형 키 skew가 병목을 만들 수 있다.</text>
<rect x="40" y="600" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="600" width="500" height="48" rx="14" fill="#ede9fe"/>
<rect x="40" y="627" width="500" height="21" fill="#ede9fe"/>
<text x="58" y="632" font-size="21" font-weight="700" fill="#5b21b6">5. AQE: 실행 중 통계</text>
<text x="60" y="678" font-size="17" fill="#334155">shuffle partition 합치기</text>
<text x="60" y="702" font-size="17" fill="#334155">조건을 만족하면 join 전략 전환</text>
<text x="60" y="726" font-size="17" fill="#334155">지원되는 경우 skew partition 분할</text>
<rect x="660" y="600" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="600" width="500" height="48" rx="14" fill="#ede9fe"/>
<rect x="660" y="627" width="500" height="21" fill="#ede9fe"/>
<text x="678" y="632" font-size="21" font-weight="700" fill="#5b21b6">6. 관찰할 결과</text>
<text x="680" y="678" font-size="17" fill="#334155">explain·Spark UI·실제 출력 행 수</text>
<text x="680" y="702" font-size="17" fill="#334155">업무상 중복은 AQE가 없애지 않는다.</text>
<text x="680" y="726" font-size="17" fill="#334155">같은 설정도 데이터에 따라 비용이 다르다.</text>
<path d="M 540 225 L 660 225" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600.0" y="212" font-size="14" text-anchor="middle" fill="#334155">join key</text>
<path d="M 290 310 L 290 340.0 L 290 340.0 L 290 370" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="302.0" y="331.0" font-size="14" text-anchor="start" fill="#334155">전략 후보</text>
<path d="M 910 310 L 910 340.0 L 910 340.0 L 910 370" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="922.0" y="331.0" font-size="14" text-anchor="start" fill="#334155">전략 후보</text>
<path d="M 290 540 L 290 570.0 L 290 570.0 L 290 600" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="302.0" y="561.0" font-size="14" text-anchor="start" fill="#334155">통계</text>
<path d="M 910 540 L 910 570.0 L 910 570.0 L 910 600" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="922.0" y="561.0" font-size="14" text-anchor="start" fill="#334155">결과</text>
<path d="M 540 685 L 660 685" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600.0" y="672" font-size="14" text-anchor="middle" fill="#334155">계획 조정</text>
<text x="40" y="815" font-size="16" fill="#475569">두 중간 카드의 전략은 대안이다. 같은 join이 반드시 두 전략을 모두 실행한다는 뜻은 아니다.</text>
<text x="40" y="838" font-size="16" fill="#475569">Broadcast는 모든 큰 테이블을 driver로 collect하는 연산과 다르다.</text>
</g>
</svg>
