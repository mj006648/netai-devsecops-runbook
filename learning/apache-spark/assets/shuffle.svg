<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">Shuffle: 같은 키를 같은 계산 위치로</title>
<desc id="desc">아래 센서 값과 이동은 설명용 예시다. 부분 평균만 단순 평균하면 결과가 틀릴 수 있다. 가운데에서 아래로 향하는 화살표는 키별 shuffle이다. 실제 partition은 여러 키를 포함할 수 있다. repartition·groupBy·일부 join은 데이터를 재분배한다. AQE는 실행 중 분할을 합칠 수 있다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#475569"/></marker></defs>
<rect width="1200" height="870" rx="18" fill="#f8fafc"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
<text x="40" y="54" font-size="30" font-weight="700" fill="#0f172a">Shuffle: 같은 키를 같은 계산 위치로</text>
<text x="40" y="92" font-size="17" fill="#475569">아래 센서 값과 이동은 설명용 예시다. 부분 평균만 단순 평균하면 결과가 틀릴 수 있다.</text>
<rect x="40" y="140" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="140" width="500" height="48" rx="14" fill="#dbeafe"/>
<rect x="40" y="167" width="500" height="21" fill="#dbeafe"/>
<text x="58" y="172" font-size="21" font-weight="700" fill="#1e40af">1. 입력 partition A</text>
<text x="60" y="218" font-size="17" fill="#334155">S1: 20, 22 / S2: 19</text>
<text x="60" y="242" font-size="17" fill="#334155">입력 위치는 센서별로 정렬되지 않았다.</text>
<text x="60" y="266" font-size="17" fill="#334155">파일 partition과 계산 partition은 다르다.</text>
<rect x="660" y="140" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="140" width="500" height="48" rx="14" fill="#dbeafe"/>
<rect x="660" y="167" width="500" height="21" fill="#dbeafe"/>
<text x="678" y="172" font-size="21" font-weight="700" fill="#1e40af">2. 입력 partition B</text>
<text x="680" y="218" font-size="17" fill="#334155">S1: 24 / S2: 21</text>
<text x="680" y="242" font-size="17" fill="#334155">같은 센서의 행이 다른 위치에도 있다.</text>
<text x="680" y="266" font-size="17" fill="#334155">전체 S1 평균은 22다.</text>
<rect x="40" y="370" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="370" width="500" height="48" rx="14" fill="#ccfbf1"/>
<rect x="40" y="397" width="500" height="21" fill="#ccfbf1"/>
<text x="58" y="402" font-size="21" font-weight="700" fill="#115e59">3. A의 부분 집계</text>
<text x="60" y="448" font-size="17" fill="#334155">S1: 합 42, 개수 2</text>
<text x="60" y="472" font-size="17" fill="#334155">S2: 합 19, 개수 1</text>
<text x="60" y="496" font-size="17" fill="#334155">각 입력에서 먼저 데이터를 줄일 수 있다.</text>
<rect x="660" y="370" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="370" width="500" height="48" rx="14" fill="#ccfbf1"/>
<rect x="660" y="397" width="500" height="21" fill="#ccfbf1"/>
<text x="678" y="402" font-size="21" font-weight="700" fill="#115e59">4. B의 부분 집계</text>
<text x="680" y="448" font-size="17" fill="#334155">S1: 합 24, 개수 1</text>
<text x="680" y="472" font-size="17" fill="#334155">S2: 합 21, 개수 1</text>
<text x="680" y="496" font-size="17" fill="#334155">key 기준으로 목적 partition을 정한다.</text>
<rect x="40" y="600" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="600" width="500" height="48" rx="14" fill="#ede9fe"/>
<rect x="40" y="627" width="500" height="21" fill="#ede9fe"/>
<text x="58" y="632" font-size="21" font-weight="700" fill="#5b21b6">5. 출력 partition: S1</text>
<text x="60" y="678" font-size="17" fill="#334155">42 + 24 = 66, 개수 2 + 1 = 3</text>
<text x="60" y="702" font-size="17" fill="#334155">66 / 3 = 평균 22</text>
<text x="60" y="726" font-size="17" fill="#334155">네트워크·직렬화·disk spill 비용 가능</text>
<rect x="660" y="600" width="500" height="170" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="660" y="600" width="500" height="48" rx="14" fill="#ede9fe"/>
<rect x="660" y="627" width="500" height="21" fill="#ede9fe"/>
<text x="678" y="632" font-size="21" font-weight="700" fill="#5b21b6">6. 출력 partition: S2</text>
<text x="680" y="678" font-size="17" fill="#334155">19 + 21 = 40, 개수 1 + 1 = 2</text>
<text x="680" y="702" font-size="17" fill="#334155">40 / 2 = 평균 20</text>
<text x="680" y="726" font-size="17" fill="#334155">한 키가 과도하게 크면 skew 발생</text>
<path d="M 290 310 L 290 340.0 L 290 340.0 L 290 370" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="302.0" y="331.0" font-size="14" text-anchor="start" fill="#334155">부분 집계</text>
<path d="M 910 310 L 910 340.0 L 910 340.0 L 910 370" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="922.0" y="331.0" font-size="14" text-anchor="start" fill="#334155">부분 집계</text>
<path d="M 290 540 L 290 570.0 L 290 570.0 L 290 600" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 290 540 L 290 570.0 L 910 570.0 L 910 600" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 910 540 L 910 570.0 L 290 570.0 L 290 600" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 910 540 L 910 570.0 L 910 570.0 L 910 600" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="815" font-size="16" fill="#475569">가운데에서 아래로 향하는 화살표는 키별 shuffle이다. 실제 partition은 여러 키를 포함할 수 있다.</text>
<text x="40" y="838" font-size="16" fill="#475569">repartition·groupBy·일부 join은 데이터를 재분배한다. AQE는 실행 중 분할을 합칠 수 있다.</text>
</g>
</svg>
