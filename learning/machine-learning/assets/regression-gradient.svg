<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">선형회귀: 예측에서 가중치 한 번 갱신까지</title>
<desc id="desc">한 관측의 제곱오차 손실과 기울기를 계산하고 학습률 0.1로 가중치와 절편을 바꾸는 예시다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">선형회귀: 예측에서 가중치 한 번 갱신까지</text>
<rect x="40" y="110" width="320" height="120" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="200.0" y="145.33333333333334" font-size="22" text-anchor="middle" fill="#172554">입력 x=2 · 정답 y=5</text><text x="200.0" y="177.33333333333334" font-size="22" text-anchor="middle" fill="#172554">초기 가중치 w=1 · 절편 b=0</text><text x="200.0" y="209.33333333333334" font-size="22" text-anchor="middle" fill="#172554">예측 = wx+b = 2</text><rect x="440" y="110" width="320" height="120" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="600.0" y="145.33333333333334" font-size="22" text-anchor="middle" fill="#172554">오차 e = 예측−정답 = −3</text><text x="600.0" y="177.33333333333334" font-size="22" text-anchor="middle" fill="#172554">손실 L = ½e² = 4.5</text><text x="600.0" y="209.33333333333334" font-size="22" text-anchor="middle" fill="#172554">오차 크기를 숫자로 비교</text><path d="M360 170 L430 170" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="110" width="320" height="120" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="1000.0" y="145.33333333333334" font-size="22" text-anchor="middle" fill="#172554">기울기: dL/dw = e×x = −6</text><text x="1000.0" y="177.33333333333334" font-size="22" text-anchor="middle" fill="#172554">dL/db = e = −3</text><text x="1000.0" y="209.33333333333334" font-size="22" text-anchor="middle" fill="#172554">변수별 손실 변화율</text><path d="M760 170 L830 170" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 230 L1000 335" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="345" width="510" height="145" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="905.0" y="392.8333333333333" font-size="22" text-anchor="middle" fill="#172554">학습률 η=0.1로 기울기의 반대 방향 이동</text><text x="905.0" y="424.8333333333333" font-size="22" text-anchor="middle" fill="#172554">새 w = 1−0.1×(−6) = 1.6</text><text x="905.0" y="456.8333333333333" font-size="22" text-anchor="middle" fill="#172554">새 b = 0−0.1×(−3) = 0.3</text><rect x="40" y="345" width="500" height="145" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="290.0" y="392.8333333333333" font-size="22" text-anchor="middle" fill="#172554">같은 입력으로 다시 계산</text><text x="290.0" y="424.8333333333333" font-size="22" text-anchor="middle" fill="#172554">새 예측 = 1.6×2+0.3 = 3.5</text><text x="290.0" y="456.8333333333333" font-size="22" text-anchor="middle" fill="#172554">새 손실 = ½(3.5−5)² = 1.125</text><path d="M650 417 L550 417" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="565" font-size="24" text-anchor="start" fill="#172554">기울기를 구하는 역전파와 값을 바꾸는 최적화기의 갱신은 다른 단계다.</text><text x="60" y="620" font-size="22" text-anchor="start" fill="#172554">한 관측의 손실이 줄어든 사례다. 새 데이터에서의 품질 개선은 별도로 평가한다.</text>
</g>
</svg>
