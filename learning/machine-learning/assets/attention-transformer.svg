<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Attention: 점수·가중치·값의 합을 실제 숫자로 보기</title>
<desc id="desc">길이 2의 query와 두 key, 두 value로 축소 내적 attention의 softmax 가중치와 출력 벡터를 계산한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">Attention: 점수·가중치·값의 합을 실제 숫자로 보기</text>
<rect x="40" y="110" width="330" height="140" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="205.0" y="156.0" font-size="21" text-anchor="middle" fill="#172554">Q: 지금 비교할 벡터 [1, 0]</text><text x="205.0" y="187.0" font-size="21" text-anchor="middle" fill="#172554">K: 비교 대상 [1,0], [0,1]</text><text x="205.0" y="218.0" font-size="21" text-anchor="middle" fill="#172554">V: 가져올 값 [10,0], [0,20]</text><rect x="435" y="110" width="345" height="140" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="607.5" y="156.0" font-size="21" text-anchor="middle" fill="#172554">Q와 각 K의 내적을 √2로 나눔</text><text x="607.5" y="187.0" font-size="21" text-anchor="middle" fill="#172554">점수 = [0.707107, 0]</text><text x="607.5" y="218.0" font-size="21" text-anchor="middle" fill="#172554">벡터 길이 d=2를 사용</text><rect x="845" y="110" width="315" height="140" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="1002.5" y="156.0" font-size="21" text-anchor="middle" fill="#172554">softmax: 양수·합 1로 변환</text><text x="1002.5" y="187.0" font-size="21" text-anchor="middle" fill="#172554">가중치 = [0.669762,</text><text x="1002.5" y="218.0" font-size="21" text-anchor="middle" fill="#172554">0.330238]</text><path d="M370 180 L425 180" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 180 L835 180" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 250 L1000 335" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="620" y="345" width="540" height="145" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="890.0" y="392.8333333333333" font-size="22" text-anchor="middle" fill="#172554">두 V를 가중치로 섞어 합산</text><text x="890.0" y="424.8333333333333" font-size="22" text-anchor="middle" fill="#172554">0.669762×[10,0] + 0.330238×[0,20]</text><text x="890.0" y="456.8333333333333" font-size="22" text-anchor="middle" fill="#172554">출력 ≈ [6.697615, 6.604769]</text><rect x="40" y="345" width="480" height="145" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="280.0" y="392.8333333333333" font-size="22" text-anchor="middle" fill="#172554">위 예제는 query 한 개의 attention</text><text x="280.0" y="424.8333333333333" font-size="22" text-anchor="middle" fill="#172554">여러 query는 각 행별로 같은 계산</text><text x="280.0" y="456.8333333333333" font-size="22" text-anchor="middle" fill="#172554">가중치는 각 query 행 안에서 합이 1</text><path d="M620 417 L530 417" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="545" width="1120" height="110" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="600.0" y="591.5" font-size="21" text-anchor="middle" fill="#172554">Transformer 층은 attention 외에 출력 투영·잔차 연결·정규화·피드포워드 계산도 포함한다.</text><text x="600.0" y="622.5" font-size="21" text-anchor="middle" fill="#172554">Q·K·V는 보통 입력 벡터에 학습되는 행렬을 곱해 만든다. 위 숫자는 계산용 고정 입력이다.</text>
</g>
</svg>
