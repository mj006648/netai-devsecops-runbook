<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg 삭제 방식: copy-on-write, v2 delete 파일, v3 deletion vector</title>
  <desc id="desc">행 id 10, 11, 12가 있는 데이터 파일에서 id 11을 삭제하는 작은 예를 사용해 copy-on-write 재작성, v2 position delete와 equality delete, v3 deletion vector 비트맵을 비교한다. 위치는 0부터 시작하며 비트 1이 삭제를 뜻한다.</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#14213d}.h1{font-size:28px;font-weight:800}.h2{font-size:18px;font-weight:800}.t{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:10.5px}.base{fill:#e8f1ff;stroke:#1756a9;stroke-width:2.5}.cow{fill:#e6f7ed;stroke:#187647;stroke-width:2.5}.v2{fill:#fff2cc;stroke:#8b5d00;stroke-width:2.5}.v3{fill:#f1e8ff;stroke:#6941a5;stroke-width:2.5}.warn{fill:#ffe9e5;stroke:#a83c27;stroke-width:2}.grid{stroke:#64748b;stroke-width:1.5}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text class="h1" x="600" y="40" text-anchor="middle">같은 DELETE, 서로 다른 물리 표현</text><text class="s" x="600" y="65" text-anchor="middle">논리 요청: data-A.parquet에서 id = 11인 행을 삭제한다.</text>
  <rect class="base" x="40" y="105" width="220" height="230" rx="16"/><text class="h2" x="150" y="137" text-anchor="middle">원본 data-A.parquet</text><text class="s" x="75" y="172">0-based 위치</text><text class="s" x="180" y="172">행</text>
  <rect x="65" y="187" width="170" height="38" fill="#fff" class="grid"/><text class="t" x="100" y="212" text-anchor="middle">0</text><text class="t" x="185" y="212" text-anchor="middle">id=10, A</text>
  <rect x="65" y="225" width="170" height="38" fill="#ffe9e5" class="grid"/><text class="t" x="100" y="250" text-anchor="middle">1</text><text class="t" x="185" y="250" text-anchor="middle">id=11, B</text>
  <rect x="65" y="263" width="170" height="38" fill="#fff" class="grid"/><text class="t" x="100" y="288" text-anchor="middle">2</text><text class="t" x="185" y="288" text-anchor="middle">id=12, C</text>
  <text class="xs" x="150" y="323" text-anchor="middle">삭제 대상 = 파일 위치 1</text>
  <rect class="cow" x="305" y="105" width="260" height="230" rx="16"/><text class="h2" x="435" y="137" text-anchor="middle">Copy-on-write (재작성)</text><text class="s" x="435" y="164" text-anchor="middle">새 data-B.parquet 생성</text><rect x="345" y="188" width="180" height="42" fill="#fff" class="grid"/><text class="t" x="435" y="215" text-anchor="middle">id=10, A</text><rect x="345" y="230" width="180" height="42" fill="#fff" class="grid"/><text class="t" x="435" y="257" text-anchor="middle">id=12, C</text><text class="s" x="435" y="296" text-anchor="middle">새 스냅샷은 B를 참조</text><text class="xs" x="435" y="317" text-anchor="middle">A는 과거 스냅샷 보존 중 남을 수 있음</text>
  <path class="a" d="M260 220 H305"/>
  <rect class="v2" x="610" y="90" width="260" height="260" rx="16"/><text class="h2" x="740" y="122" text-anchor="middle">v2: delete 파일 병합 읽기</text><text class="t" x="635" y="158">Position delete</text><text class="s" x="635" y="182">(file = data-A, pos = 1)</text><text class="xs" x="635" y="203">정확한 파일+0-based 행 위치</text><line x1="630" y1="220" x2="850" y2="220" stroke="#8b5d00"/><text class="t" x="635" y="250">Equality delete</text><text class="s" x="635" y="274">equality field id = [1], id = 11</text><text class="xs" x="635" y="295">키가 같은 적용 대상 데이터 행 제거</text><text class="s" x="740" y="328" text-anchor="middle">원본 A + delete를 읽을 때 병합</text>
  <rect class="v3" x="915" y="90" width="245" height="260" rx="16"/><text class="h2" x="1037" y="122" text-anchor="middle">v3: Deletion Vector</text><text class="s" x="1037" y="151" text-anchor="middle">data-A에 연결된 Puffin blob</text><text class="s" x="953" y="188">위치</text><text class="t" x="1000" y="188">0</text><text class="t" x="1040" y="188">1</text><text class="t" x="1080" y="188">2</text><text class="s" x="953" y="232">DV</text><rect x="984" y="207" width="34" height="34" fill="#fff" class="grid"/><rect x="1018" y="207" width="34" height="34" fill="#ffe9e5" class="grid"/><rect x="1052" y="207" width="34" height="34" fill="#fff" class="grid"/><text class="t" x="1001" y="230" text-anchor="middle">0</text><text class="t" x="1035" y="230" text-anchor="middle">1</text><text class="t" x="1069" y="230" text-anchor="middle">0</text><text class="s" x="1037" y="270" text-anchor="middle">1 = 삭제, 0 = 유지</text><text class="xs" x="1037" y="294" text-anchor="middle">이 그림의 비트 표기는 개념적</text><text class="s" x="1037" y="323" text-anchor="middle">한 데이터 파일당 DV 최대 하나</text>
  <rect class="warn" x="40" y="395" width="1120" height="205" rx="16"/><text class="h2" x="600" y="427" text-anchor="middle">읽기 결과는 모두 동일: id 10, id 12</text>
  <text class="t" x="75" y="465">비교</text><text class="s" x="240" y="465">데이터 파일</text><text class="s" x="450" y="465">삭제 표현</text><text class="s" x="675" y="465">읽기 비용/특징</text><text class="s" x="1000" y="465">스펙</text><line x1="70" y1="480" x2="1130" y2="480" stroke="#a83c27"/>
  <text class="s" x="75" y="510">COW</text><text class="s" x="240" y="510">새 파일로 교체</text><text class="s" x="450" y="510">별도 delete 없음</text><text class="s" x="675" y="510">읽기 단순, 쓰기 증폭</text><text class="s" x="1000" y="510">v1+</text>
  <text class="s" x="75" y="540">Position/Equality</text><text class="s" x="240" y="540">원본 유지</text><text class="s" x="450" y="540">별도 Parquet delete 파일</text><text class="s" x="675" y="540">읽을 때 병합, 여러 delete 가능</text><text class="s" x="1000" y="540">v2 도입</text>
  <text class="s" x="75" y="570">Deletion Vector</text><text class="s" x="240" y="570">원본 유지</text><text class="s" x="450" y="570">위치 집합을 Puffin blob에 저장</text><text class="s" x="675" y="570">조밀한 위치 삭제를 압축·빠른 적용</text><text class="s" x="1000" y="570">v3</text>
  <text class="xs" x="600" y="636" text-anchor="middle">v3는 position delete 신규 작성을 금지하지만 equality delete는 허용한다. 업그레이드 전 기존 position delete도 정리 전까지 유효하다.</text>
  <text class="xs" x="600" y="681" text-anchor="middle">DV의 위치는 반드시 참조 데이터 파일의 행 순서에 대한 0-based position이다. 비트 자체의 직렬화 세부는 구현/스펙을 따른다.</text>
</svg>
