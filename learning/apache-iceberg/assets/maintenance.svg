<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg 안전한 유지보수 순서</title>
  <desc id="desc">작은 파일 A B C를 큰 파일 D로 컴팩션해 현재 스냅샷을 갱신하지만 태그와 과거 스냅샷은 옛 파일을 계속 참조하는 모습. 스냅샷 만료 후에만 미참조 파일 후보가 되고, orphan 파일 제거는 충분한 시간 안전 구간과 시계 동기화를 확인한 뒤 실행해야 한다.</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#14213d}.h1{font-size:28px;font-weight:800}.h2{font-size:18px;font-weight:800}.t{font-size:14px;font-weight:650}.s{font-size:12px}.xs{font-size:10.5px}.step{fill:#f8fafc;stroke:#64748b;stroke-width:2}.cur{fill:#e6f7ed;stroke:#187647;stroke-width:2.5}.hist{fill:#e8f1ff;stroke:#1756a9;stroke-width:2.5}.file{fill:#fff2cc;stroke:#8b5d00;stroke-width:2}.danger{fill:#ffe9e5;stroke:#a83c27;stroke-width:2.5}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.ref{stroke:#1756a9;stroke-width:2.5;fill:none}.dead{stroke:#a83c27;stroke-width:2.5;stroke-dasharray:7 5;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text class="h1" x="600" y="40" text-anchor="middle">유지보수는 “새 배치 → 참조 정리 → 고아 정리” 순서</text><text class="s" x="600" y="65" text-anchor="middle">컴팩션 직후 옛 파일은 고아가 아니다. 과거 스냅샷·브랜치·태그가 참조할 수 있다.</text>
  <rect class="step" x="35" y="100" width="350" height="330" rx="16"/><text class="h2" x="210" y="132" text-anchor="middle">① 컴팩션 커밋</text><text class="s" x="210" y="158" text-anchor="middle">작은 파일을 읽고 큰 파일 D를 새로 생성</text>
  <rect class="file" x="65" y="190" width="75" height="55" rx="9"/><text class="t" x="102" y="223" text-anchor="middle">A</text><rect class="file" x="155" y="190" width="75" height="55" rx="9"/><text class="t" x="192" y="223" text-anchor="middle">B</text><rect class="file" x="245" y="190" width="75" height="55" rx="9"/><text class="t" x="282" y="223" text-anchor="middle">C</text>
  <path class="a" d="M192 260 V295"/><rect class="cur" x="105" y="295" width="210" height="70" rx="12"/><text class="t" x="210" y="323" text-anchor="middle">D.parquet</text><text class="s" x="210" y="347" text-anchor="middle">A+B+C의 행, 더 큰 파일</text><text class="xs" x="210" y="398" text-anchor="middle">현재 스냅샷 S2 → D</text>
  <rect class="step" x="425" y="100" width="350" height="330" rx="16"/><text class="h2" x="600" y="132" text-anchor="middle">② 모든 참조를 확인</text>
  <rect class="cur" x="455" y="165" width="125" height="62" rx="10"/><text class="t" x="517" y="190" text-anchor="middle">main → S2</text><text class="s" x="517" y="212" text-anchor="middle">D 참조</text>
  <rect class="hist" x="620" y="165" width="125" height="62" rx="10"/><text class="t" x="682" y="190" text-anchor="middle">tag audit → S1</text><text class="s" x="682" y="212" text-anchor="middle">A+B+C 참조</text>
  <rect class="file" x="455" y="285" width="125" height="58" rx="9"/><text class="t" x="517" y="320" text-anchor="middle">D</text><rect class="file" x="620" y="275" width="125" height="78" rx="9"/><text class="t" x="682" y="305" text-anchor="middle">A · B · C</text><text class="xs" x="682" y="332" text-anchor="middle">아직 필요함!</text><path class="ref" d="M517 227 V285"/><path class="ref" d="M682 227 V275"/><text class="xs" x="600" y="390" text-anchor="middle">브랜치·태그의 보존 정책도 snapshot expiration에 영향</text>
  <rect class="step" x="815" y="100" width="350" height="330" rx="16"/><text class="h2" x="990" y="132" text-anchor="middle">③ 만료 후 고아 후보 정리</text><text class="s" x="990" y="162" text-anchor="middle">정책에 따라 S1/참조가 사라진 뒤</text><rect class="hist" x="860" y="195" width="260" height="65" rx="10"/><text class="t" x="990" y="222" text-anchor="middle">expire snapshots</text><text class="s" x="990" y="245" text-anchor="middle">도달 불가 메타데이터·파일 참조 제거</text><path class="a" d="M990 260 V290"/><rect class="danger" x="860" y="290" width="260" height="80" rx="10"/><text class="t" x="990" y="318" text-anchor="middle">remove orphan files</text><text class="s" x="990" y="342" text-anchor="middle">어떤 유효 메타데이터도 참조하지 않고</text><text class="s" x="990" y="360" text-anchor="middle">안전 시간보다 오래된 파일만 삭제</text><text class="xs" x="990" y="400" text-anchor="middle">순서를 거꾸로 하면 과거 조회/진행 중 커밋 손상 위험</text>
  <path class="a" d="M385 265 H425"/><path class="a" d="M775 265 H815"/>
  <rect class="danger" x="35" y="480" width="1130" height="150" rx="16"/><text class="h2" x="600" y="512" text-anchor="middle">⚠ Clock guard: 파일 시각만 믿고 빠르게 지우지 않는다</text><text class="s" x="65" y="544">• writer, catalog, object store, maintenance host의 시계가 어긋나면 방금 생성한 파일이 “오래된 고아”처럼 보일 수 있다.</text><text class="s" x="65" y="571">• 진행 중인 커밋이 만든 파일은 아직 현재 metadata에서 보이지 않을 수 있다. 충분한 older-than 보존 구간을 둔다(기본값/최솟값은 사용 버전 확인).</text><text class="s" x="65" y="598">• dry run/후보 목록, 보존 중인 refs, 가장 오래 걸리는 쓰기 시간, NTP 상태를 확인하고 삭제한다. 객체 저장소 lifecycle 규칙도 같은 원칙을 따른다.</text>
  <text class="xs" x="600" y="679" text-anchor="middle">안전 조건: “현재 스냅샷에서 안 보임”만으로는 부족하다. 모든 유효 참조에서 도달 불가 + 안전 시간 경과가 함께 필요하다.</text>
</svg>
