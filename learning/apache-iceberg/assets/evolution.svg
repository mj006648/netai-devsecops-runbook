<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg 스키마와 파티션 진화</title>
  <desc id="desc">열 이름이 customer_id에서 buyer_id로 바뀌어도 field ID 2가 유지되는 예와, partition spec 0의 월 파티션 파일과 spec 1의 일 파티션 파일이 한 테이블에 공존하며 각 파일의 spec ID로 해석되는 예.</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#14213d}.h1{font-size:29px;font-weight:800}.h2{font-size:20px;font-weight:800}.t{font-size:15px;font-weight:650}.s{font-size:13px}.xs{font-size:11px}.old{fill:#e8f1ff;stroke:#1756a9;stroke-width:2.5}.new{fill:#e6f7ed;stroke:#187647;stroke-width:2.5}.part{fill:#fff2cc;stroke:#8b5d00;stroke-width:2.5}.file{fill:#f1e8ff;stroke:#6941a5;stroke-width:2.5}.note{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.same{stroke:#187647;stroke-width:4;fill:none;marker-end:url(#g)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#187647"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text class="h1" x="600" y="42" text-anchor="middle">진화의 기준은 “이름”이 아니라 ID와 변환 규칙</text><text class="s" x="600" y="68" text-anchor="middle">오래된 파일을 다시 쓰지 않아도 새 스키마·새 파티션 전략을 적용할 수 있다.</text>
  <text class="h2" x="285" y="110" text-anchor="middle">A. 스키마 진화: field ID가 열의 정체성</text>
  <rect class="old" x="55" y="135" width="235" height="190" rx="16"/><text class="t" x="172" y="166" text-anchor="middle">schema-id = 0</text><text class="s" x="85" y="202">1: order_id  long</text><text class="s" x="85" y="232">2: customer_id string</text><text class="s" x="85" y="262">3: amount decimal</text><text class="xs" x="172" y="302" text-anchor="middle">물리 파일의 열 ID도 1, 2, 3</text>
  <rect class="new" x="360" y="135" width="235" height="190" rx="16"/><text class="t" x="477" y="166" text-anchor="middle">schema-id = 1</text><text class="s" x="390" y="202">1: order_id  long</text><text class="t" x="390" y="232">2: buyer_id string</text><text class="s" x="390" y="262">3: amount decimal</text><text class="xs" x="477" y="302" text-anchor="middle">이름만 변경, ID 2는 그대로</text>
  <path class="same" d="M290 230 H360"/><text class="xs" x="325" y="216" text-anchor="middle">RENAME</text>
  <rect class="note" x="55" y="350" width="540" height="112" rx="14"/><text class="t" x="80" y="380">SELECT buyer_id → field ID 2를 읽는다</text><text class="s" x="80" y="407">옛 파일의 customer_id 자리도 ID 2이므로 같은 열로 안전하게 연결된다.</text><text class="s" x="80" y="434">삭제한 이름을 다른 의미로 재사용하지 않는다. 새 열에는 새 field ID를 부여한다.</text>
  <text class="h2" x="895" y="110" text-anchor="middle">B. 파티션 진화: spec ID별 해석</text>
  <rect class="part" x="655" y="135" width="220" height="125" rx="16"/><text class="t" x="765" y="167" text-anchor="middle">spec-id = 0</text><text class="s" x="765" y="197" text-anchor="middle">month(ts)</text><text class="s" x="765" y="224" text-anchor="middle">2026-10</text><text class="xs" x="765" y="247" text-anchor="middle">예전 쓰기 규칙</text>
  <rect class="part" x="925" y="135" width="220" height="125" rx="16"/><text class="t" x="1035" y="167" text-anchor="middle">spec-id = 1</text><text class="s" x="1035" y="197" text-anchor="middle">day(ts)</text><text class="s" x="1035" y="224" text-anchor="middle">2026-10-08</text><text class="xs" x="1035" y="247" text-anchor="middle">새 쓰기 규칙</text>
  <rect class="file" x="655" y="310" width="220" height="115" rx="14"/><text class="t" x="765" y="342" text-anchor="middle">old-01.parquet</text><text class="s" x="765" y="371" text-anchor="middle">spec 0 · month=2026-10</text><text class="s" x="765" y="398" text-anchor="middle">ts: 10/01 … 10/31</text>
  <rect class="file" x="925" y="310" width="220" height="115" rx="14"/><text class="t" x="1035" y="342" text-anchor="middle">new-17.parquet</text><text class="s" x="1035" y="371" text-anchor="middle">spec 1 · day=2026-10-08</text><text class="s" x="1035" y="398" text-anchor="middle">ts: 10/08</text>
  <path class="a" d="M765 260 V310"/><path class="a" d="M1035 260 V310"/>
  <rect class="note" x="655" y="465" width="490" height="115" rx="14"/><text class="t" x="680" y="496">WHERE ts = '2026-10-08'</text><text class="s" x="680" y="525">spec 0 파일: month(ts)=2026-10이면 후보</text><text class="s" x="680" y="551">spec 1 파일: day(ts)=2026-10-08이면 후보</text><text class="xs" x="900" y="572" text-anchor="middle">각 파일의 spec ID를 보고 올바른 변환으로 필터를 투영</text>
  <rect class="note" x="55" y="610" width="1090" height="55" rx="12"/><text class="s" x="600" y="643" text-anchor="middle">숨은 파티셔닝: 사용자는 논리 열 ts로 질의하고, Iceberg가 month/day 변환과 여러 spec의 공존을 처리한다.</text>
  <text class="xs" x="600" y="690" text-anchor="middle">진화는 이후 쓰기 규칙을 바꾼다. 기존 데이터 파일을 자동으로 재작성하는 작업은 아니다.</text>
</svg>
