<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg 스냅샷 시간선과 공유 데이터 파일</title>
  <desc id="desc">스냅샷 S1과 S2가 변경되지 않은 데이터 파일 A와 B를 공유하고 S2가 새 파일 C를 추가하는 예. 현재 조회와 snapshot-id 또는 timestamp를 사용한 과거 시점 조회를 비교한다.</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#172033}.h1{font-size:29px;font-weight:800}.h2{font-size:20px;font-weight:800}.t{font-size:16px;font-weight:650}.s{font-size:13px}.xs{font-size:11px}.snap{fill:#e8f1ff;stroke:#1756a9;stroke-width:3}.cur{fill:#fff2cc;stroke:#8b5d00;stroke-width:3}.file{fill:#e6f7ed;stroke:#187647;stroke-width:2.5}.new{fill:#f1e8ff;stroke:#6941a5;stroke-width:2.5}.q{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.share{stroke:#187647;stroke-width:3;fill:none}.timeline{stroke:#334155;stroke-width:4;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text class="h1" x="600" y="42" text-anchor="middle">스냅샷은 파일 복사가 아니라 “파일 집합의 새 버전”</text><text class="s" x="600" y="69" text-anchor="middle">커밋마다 새 메타데이터가 생기며, 바뀌지 않은 데이터 파일은 여러 스냅샷이 그대로 공유한다.</text>
  <line class="timeline" x1="95" y1="150" x2="1090" y2="150"/><circle cx="300" cy="150" r="10" fill="#1756a9"/><circle cx="785" cy="150" r="10" fill="#8b5d00"/>
  <text class="t" x="300" y="120" text-anchor="middle">10:00 — S1 (id 101)</text><text class="t" x="785" y="120" text-anchor="middle">10:05 — S2 (id 102, 현재)</text><text class="s" x="1070" y="133" text-anchor="end">시간 →</text>
  <rect class="snap" x="120" y="205" width="360" height="155" rx="18"/><text class="h2" x="300" y="240" text-anchor="middle">S1: INSERT A, B</text><text class="s" x="300" y="267" text-anchor="middle">파일 집합 = {A.parquet, B.parquet}</text><text class="s" x="300" y="292" text-anchor="middle">parent-snapshot-id 없음</text><text class="xs" x="300" y="326" text-anchor="middle">S1 manifest list → A, B를 가리킴</text>
  <rect class="cur" x="605" y="205" width="360" height="155" rx="18"/><text class="h2" x="785" y="240" text-anchor="middle">S2: APPEND C</text><text class="s" x="785" y="267" text-anchor="middle">파일 집합 = {A.parquet, B.parquet, C.parquet}</text><text class="s" x="785" y="292" text-anchor="middle">parent-snapshot-id = 101</text><text class="xs" x="785" y="326" text-anchor="middle">S2 manifest list → 기존 manifest + 새 C manifest</text>
  <path class="a" d="M605 280 H490"/><text class="s" x="548" y="265" text-anchor="middle">부모</text>
  <rect class="file" x="100" y="430" width="220" height="90" rx="14"/><text class="t" x="210" y="465" text-anchor="middle">A.parquet</text><text class="s" x="210" y="491" text-anchor="middle">id 1, 2</text>
  <rect class="file" x="380" y="430" width="220" height="90" rx="14"/><text class="t" x="490" y="465" text-anchor="middle">B.parquet</text><text class="s" x="490" y="491" text-anchor="middle">id 3, 4</text>
  <rect class="new" x="725" y="430" width="220" height="90" rx="14"/><text class="t" x="835" y="465" text-anchor="middle">C.parquet (신규)</text><text class="s" x="835" y="491" text-anchor="middle">id 5, 6</text>
  <path class="share" d="M250 360 V397 H210 V430"/><path class="share" d="M350 360 V397 H490 V430"/><path class="share" d="M725 360 V395 H210 V430"/><path class="share" d="M785 360 V408 H490 V430"/><path class="share" d="M850 360 V395 H835 V430"/>
  <text class="xs" x="565" y="412" text-anchor="middle">A·B는 물리적으로 한 벌 — 두 스냅샷이 공유</text>
  <rect class="q" x="60" y="570" width="500" height="88" rx="14"/><text class="t" x="85" y="601">현재 조회 → S2 → A + B + C</text><text class="s" x="85" y="628">카탈로그의 current snapshot을 따라간다.</text>
  <rect class="q" x="640" y="570" width="500" height="88" rx="14"/><text class="t" x="665" y="601">시간 여행(snapshot 101 또는 10:03) → S1 → A + B</text><text class="s" x="665" y="628">엔진별 SQL 문법은 다르며, 만료되지 않은 스냅샷만 조회 가능하다.</text>
  <text class="xs" x="600" y="687" text-anchor="middle">과거 스냅샷을 보존하는 동안 공유 파일 A·B를 함부로 삭제하면 안 된다.</text>
</svg>
