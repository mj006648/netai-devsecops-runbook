<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg v3 행 계보의 row id와 last updated sequence number</title>
  <desc id="desc">행 id 11을 위치 기반으로 갱신하면 시스템 열 row id 501이 유지되고 last updated sequence number가 8에서 12로 바뀌는 예. equality delete 후 insert는 원래 행을 정확히 식별하지 못해 새 row id 700을 받는 예. 값이 바뀌지 않은 물리 재작성은 두 계보 값을 보존한다.</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#14213d}.h1{font-size:28px;font-weight:800}.h2{font-size:18px;font-weight:800}.t{font-size:14px;font-weight:650}.s{font-size:12px}.xs{font-size:10.5px}.base{fill:#e8f1ff;stroke:#1756a9;stroke-width:2.5}.good{fill:#e6f7ed;stroke:#187647;stroke-width:2.5}.warn{fill:#fff2cc;stroke:#8b5d00;stroke-width:2.5}.rewrite{fill:#f1e8ff;stroke:#6941a5;stroke-width:2.5}.note{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text class="h1" x="600" y="40" text-anchor="middle">v3 Row Lineage: “이 행이 누구인지”와 “언제 바뀌었는지”</text><text class="s" x="600" y="65" text-anchor="middle">시스템 필드 _row_id와 _last_updated_sequence_number는 변경 데이터 캡처와 행 추적의 기반이다.</text>
  <rect class="base" x="45" y="110" width="330" height="180" rx="16"/><text class="h2" x="210" y="142" text-anchor="middle">스냅샷 sequence = 8</text><text class="s" x="70" y="177">사용자 열</text><text class="t" x="70" y="204">id=11, status='new'</text><text class="s" x="70" y="239">시스템 계보</text><text class="t" x="70" y="265">_row_id=501, _last_updated…=8</text>
  <rect class="good" x="455" y="92" width="330" height="215" rx="16"/><text class="h2" x="620" y="125" text-anchor="middle">위치 기반 UPDATE (seq=12)</text><text class="s" x="480" y="159">data file + position으로 원행 식별</text><text class="t" x="480" y="191">id=11, status='paid'</text><text class="t" x="480" y="224">_row_id=501  ← 유지</text><text class="t" x="480" y="252">_last_updated…=12  ← 변경</text><text class="xs" x="620" y="286" text-anchor="middle">같은 논리 행, 값이 갱신됨</text>
  <path class="a" d="M375 200 H455"/>
  <rect class="warn" x="865" y="92" width="290" height="215" rx="16"/><text class="h2" x="1010" y="125" text-anchor="middle">Equality delete + INSERT</text><text class="s" x="890" y="159">키 id=11만으로 삭제 후 새 행 추가</text><text class="t" x="890" y="191">id=11, status='paid'</text><text class="t" x="890" y="224">_row_id=700  ← 새 ID</text><text class="t" x="890" y="252">_last_updated…=12</text><text class="xs" x="1010" y="286" text-anchor="middle">원행과 동일성을 보존한다고 볼 수 없음</text>
  <path class="a" d="M785 200 H865"/><text class="xs" x="825" y="185" text-anchor="middle">대조</text>
  <rect class="rewrite" x="250" y="365" width="700" height="150" rx="18"/><text class="h2" x="600" y="398" text-anchor="middle">값이 그대로인 물리 재작성/컴팩션 (seq=20)</text><text class="s" x="600" y="429" text-anchor="middle">small-1.parquet → compact-9.parquet로 파일 위치는 바뀌어도 행 내용은 바뀌지 않음</text><text class="t" x="600" y="461" text-anchor="middle">id=11, status='paid', _row_id=501, _last_updated_sequence_number=12</text><text class="s" x="600" y="490" text-anchor="middle">둘 다 보존 — 파일 재배치는 사용자 관점의 행 갱신이 아니다.</text>
  <path class="a" d="M620 307 V365"/>
  <rect class="note" x="45" y="560" width="1110" height="92" rx="14"/><text class="t" x="70" y="591">tiny change-feed 예</text><text class="s" x="70" y="618">_last_updated_sequence_number &gt; 8을 읽으면 위치 기반 UPDATE 행(501, seq 12)은 잡히고, 이후 값 보존 컴팩션(seq 20)은 새 변경으로 오인하지 않는다.</text><text class="xs" x="70" y="640">실제 증분 읽기 지원과 문법은 엔진/라이브러리별로 확인해야 한다. 이 그림은 시스템 필드의 의미를 설명한다.</text>
  <text class="xs" x="600" y="684" text-anchor="middle">_row_id는 테이블 안에서 행의 안정적 정체성이다. 일반 사용자 기본 키와 같은 의미라고 가정하면 안 된다.</text>
</svg>
