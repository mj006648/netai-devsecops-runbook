<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg 낙관적 동시성 커밋 충돌과 unknown commit state</title>
  <desc id="desc">두 작성자가 같은 metadata v41을 읽고 새 파일과 메타데이터를 준비한 뒤 카탈로그 compare-and-swap을 경쟁하는 흐름. 작성자 A는 성공하고 B는 충돌 후 최신 상태를 다시 읽어 재시도한다. 별도 영역에서 응답 유실로 커밋 결과를 알 수 없는 unknown commit state를 설명한다.</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#14213d}.h1{font-size:28px;font-weight:800}.h2{font-size:19px;font-weight:800}.t{font-size:15px;font-weight:650}.s{font-size:13px}.xs{font-size:11px}.lane{fill:#f8fafc;stroke:#64748b;stroke-width:2}.ok{fill:#e6f7ed;stroke:#187647;stroke-width:2.5}.warn{fill:#fff2cc;stroke:#8b5d00;stroke-width:2.5}.bad{fill:#ffe9e5;stroke:#a83c27;stroke-width:2.5}.meta{fill:#e8f1ff;stroke:#1756a9;stroke-width:2.5}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.retry{stroke:#a83c27;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#r)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a83c27"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text class="h1" x="600" y="40" text-anchor="middle">동시 쓰기: 준비는 병렬, 공개는 원자적 포인터 교체</text><text class="s" x="600" y="66" text-anchor="middle">데이터 파일을 먼저 쓰고, 마지막 CAS(compare-and-swap)가 “현재 테이블 버전”을 한 명에게만 허용한다.</text>
  <rect class="lane" x="40" y="100" width="220" height="385" rx="16"/><text class="h2" x="150" y="132" text-anchor="middle">작성자 A</text>
  <rect class="meta" x="65" y="158" width="170" height="62" rx="10"/><text class="t" x="150" y="184" text-anchor="middle">v41 읽기</text><text class="s" x="150" y="205" text-anchor="middle">base = v41</text>
  <rect class="meta" x="65" y="253" width="170" height="78" rx="10"/><text class="t" x="150" y="280" text-anchor="middle">A.parquet + v42A</text><text class="s" x="150" y="304" text-anchor="middle">아직 비공개 준비</text>
  <rect class="ok" x="65" y="380" width="170" height="70" rx="10"/><text class="t" x="150" y="407" text-anchor="middle">CAS 성공 ✓</text><text class="s" x="150" y="431" text-anchor="middle">v41 → v42A</text>
  <path class="a" d="M150 220 V253"/><path class="a" d="M150 331 V380"/>
  <rect class="lane" x="320" y="100" width="220" height="385" rx="16"/><text class="h2" x="430" y="132" text-anchor="middle">작성자 B</text>
  <rect class="meta" x="345" y="158" width="170" height="62" rx="10"/><text class="t" x="430" y="184" text-anchor="middle">v41 읽기</text><text class="s" x="430" y="205" text-anchor="middle">base = v41</text>
  <rect class="meta" x="345" y="253" width="170" height="78" rx="10"/><text class="t" x="430" y="280" text-anchor="middle">B.parquet + v42B</text><text class="s" x="430" y="304" text-anchor="middle">아직 비공개 준비</text>
  <rect class="bad" x="345" y="380" width="170" height="70" rx="10"/><text class="t" x="430" y="407" text-anchor="middle">CAS 충돌 ✕</text><text class="s" x="430" y="431" text-anchor="middle">현재는 이미 v42A</text>
  <path class="a" d="M430 220 V253"/><path class="a" d="M430 331 V380"/>
  <rect class="warn" x="600" y="118" width="245" height="150" rx="16"/><text class="h2" x="722" y="150" text-anchor="middle">B의 안전한 재시도</text><text class="s" x="722" y="181" text-anchor="middle">1. 최신 v42A 다시 읽기</text><text class="s" x="722" y="205" text-anchor="middle">2. 변경 검증·메타데이터 재작성</text><text class="s" x="722" y="229" text-anchor="middle">3. v42A → v43B CAS</text><text class="xs" x="722" y="251" text-anchor="middle">작업 종류에 따라 충돌 검증 범위가 다름</text>
  <path class="retry" d="M515 415 C570 415 560 210 600 210"/>
  <rect class="ok" x="600" y="305" width="245" height="85" rx="14"/><text class="t" x="722" y="336" text-anchor="middle">성공한 최종 상태</text><text class="s" x="722" y="362" text-anchor="middle">v43B → A.parquet + B.parquet 포함</text>
  <path class="a" d="M722 268 V305"/>
  <rect class="bad" x="900" y="100" width="260" height="290" rx="16"/><text class="h2" x="1030" y="128" text-anchor="middle">별개: Unknown</text><text class="h2" x="1030" y="151" text-anchor="middle">commit state</text><text class="s" x="1030" y="180" text-anchor="middle">CAS 요청 후 응답이 유실됨</text><text class="t" x="1030" y="211" text-anchor="middle">성공? 실패? 지금은 모름</text><path class="a" d="M960 244 H1100"/><text class="xs" x="1030" y="235" text-anchor="middle">네트워크 단절</text><text class="s" x="1030" y="276" text-anchor="middle">카탈로그/테이블 상태를 확인해</text><text class="s" x="1030" y="299" text-anchor="middle">내 커밋이 현재 이력에 있는지 판별</text><text class="s" x="1030" y="332" text-anchor="middle">확인 전 같은 쓰기를 무작정 반복하면</text><text class="t" x="1030" y="356" text-anchor="middle">중복 결과 위험</text><text class="xs" x="1030" y="379" text-anchor="middle">“충돌”과 “결과 불명”은 다른 오류</text>
  <rect class="lane" x="40" y="535" width="1120" height="112" rx="16"/><text class="t" x="65" y="566">작은 예: 두 작업자가 같은 행 id 범위를 수정한다면?</text><text class="s" x="65" y="594">A 성공 후 B는 최신 스냅샷에서 충돌 검증을 다시 한다. 안전하게 재기반할 수 없으면 B 작업은 실패하며 사용자가 다시 실행해야 한다.</text><text class="s" x="65" y="620">커밋 재시도는 보통 엔진/Iceberg 라이브러리가 담당하지만, 비멱등 외부 부작용은 애플리케이션이 별도로 다뤄야 한다.</text>
  <text class="xs" x="600" y="683" text-anchor="middle">핵심: CAS 실패는 “내 커밋이 공개되지 않음”이 분명하지만, unknown state는 먼저 공개 여부부터 확인해야 한다.</text>
</svg>
