<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg 메타데이터 트리와 각 파일 형식</title>
  <desc id="desc">카탈로그 포인터에서 table metadata JSON, snapshot, manifest list Avro를 거쳐 서로 분리된 data manifest와 delete manifest로 내려가는 트리. data manifest는 데이터 파일을, delete manifest는 v2 delete 파일 또는 v3 Puffin deletion vector의 대상 파일, 오프셋, 길이를 추적한다. 별도의 통계 Puffin 참조도 구분한다.</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#14213d}.h1{font-size:29px;font-weight:800}.h2{font-size:18px;font-weight:800}.t{font-size:15px;font-weight:650}.s{font-size:13px}.xs{font-size:11px}.box{stroke-width:2.5;rx:14}.cat{fill:#fff2cc;stroke:#8b5d00}.json{fill:#e8f1ff;stroke:#1756a9}.avro{fill:#f1e8ff;stroke:#6941a5}.file{fill:#e6f7ed;stroke:#187647}.aux{fill:#ffe9e5;stroke:#a83c27}.q{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#a83c27;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#r)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a83c27"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text class="h1" x="600" y="42" text-anchor="middle">현재 행을 찾는 “포인터의 나무”</text><text class="s" x="600" y="68" text-anchor="middle">위 계층은 아래 계층의 위치와 요약 통계를 담는다. 엔진은 가지를 가지치기해 불필요한 파일을 열지 않는다.</text>
  <rect class="box cat" x="40" y="115" width="190" height="104"/><text class="h2" x="135" y="145" text-anchor="middle">카탈로그 포인터</text><text class="t" x="135" y="174" text-anchor="middle">sales → v42.json</text><text class="xs" x="135" y="198" text-anchor="middle">현재 메타데이터는?</text>
  <rect class="box json" x="280" y="100" width="220" height="135"/><text class="h2" x="390" y="132" text-anchor="middle">Table Metadata</text><text class="t" x="390" y="158" text-anchor="middle">metadata/v42.json</text><text class="s" x="390" y="184" text-anchor="middle">schema · partition specs</text><text class="s" x="390" y="205" text-anchor="middle">snapshots · current-snapshot-id</text><text class="xs" x="390" y="224" text-anchor="middle">테이블의 현재 상태는?</text>
  <rect class="box json" x="550" y="110" width="190" height="115"/><text class="h2" x="645" y="142" text-anchor="middle">Snapshot 항목</text><text class="t" x="645" y="170" text-anchor="middle">snapshot-id = 103</text><text class="s" x="645" y="194" text-anchor="middle">manifest-list URI</text><text class="xs" x="645" y="214" text-anchor="middle">어느 커밋을 볼까?</text>
  <rect class="box avro" x="790" y="100" width="230" height="135"/><text class="h2" x="905" y="132" text-anchor="middle">Manifest List (Avro)</text><text class="t" x="905" y="158" text-anchor="middle">snap-103-….avro</text><text class="s" x="905" y="184" text-anchor="middle">manifest별 파티션 요약</text><text class="s" x="905" y="205" text-anchor="middle">content: DATA 또는 DELETES</text><text class="xs" x="905" y="224" text-anchor="middle">어느 manifest를 열까?</text>
  <path class="a" d="M230 167 H280"/><path class="a" d="M500 167 H550"/><path class="a" d="M740 167 H790"/>
  <rect class="box avro" x="60" y="285" width="250" height="140"/><text class="h2" x="185" y="317" text-anchor="middle">Data Manifest (Avro)</text><text class="t" x="185" y="343" text-anchor="middle">content = DATA (0)</text><text class="s" x="185" y="368" text-anchor="middle">data file 경로 · partition</text><text class="s" x="185" y="390" text-anchor="middle">행 수 · 열 lower/upper bound</text><text class="xs" x="185" y="412" text-anchor="middle">데이터 manifest 묶음</text>
  <rect class="box avro" x="350" y="285" width="250" height="140"/><text class="h2" x="475" y="317" text-anchor="middle">Delete Manifest (Avro)</text><text class="t" x="475" y="343" text-anchor="middle">content = DELETES (1)</text><text class="s" x="475" y="368" text-anchor="middle">v2 delete file 또는 v3 DV</text><text class="s" x="475" y="390" text-anchor="middle">status · sequence · 대상 정보</text><text class="xs" x="475" y="412" text-anchor="middle">데이터 manifest와 별도 묶음</text>
  <path class="a" d="M905 235 V255 H185 V285"/><path class="a" d="M905 235 V265 H475 V285"/>
  <rect class="box file" x="60" y="465" width="250" height="95"/><text class="h2" x="185" y="495" text-anchor="middle">Data File</text><text class="t" x="185" y="522" text-anchor="middle">data-0007.parquet</text><text class="s" x="185" y="545" text-anchor="middle">실제 테이블 행</text>
  <rect class="box aux" x="350" y="465" width="250" height="95"/><text class="h2" x="475" y="495" text-anchor="middle">v2 Delete File</text><text class="t" x="475" y="522" text-anchor="middle">pos/equality-delete.parquet</text><text class="s" x="475" y="545" text-anchor="middle">삭제할 위치 또는 equality key</text>
  <rect class="box aux" x="640" y="450" width="260" height="125"/><text class="h2" x="770" y="479" text-anchor="middle">v3 DV (Puffin blob)</text><text class="s" x="770" y="504" text-anchor="middle">target = data-0007.parquet</text><text class="s" x="770" y="527" text-anchor="middle">file = deletes.puffin</text><text class="s" x="770" y="550" text-anchor="middle">offset = 4096 · length = 128</text><text class="xs" x="770" y="568" text-anchor="middle">DV 하나를 개별 추적</text>
  <rect class="box aux" x="940" y="450" width="220" height="125"/><text class="h2" x="1050" y="479" text-anchor="middle">통계 Puffin (선택)</text><text class="t" x="1050" y="505" text-anchor="middle">NDV 추정 등 통계 blob</text><text class="s" x="1050" y="530" text-anchor="middle">metadata JSON의 statistics/</text><text class="s" x="1050" y="550" text-anchor="middle">partition-statistics가 참조</text><text class="xs" x="1050" y="568" text-anchor="middle">DV Puffin과 목적·참조가 다름</text>
  <path class="a" d="M185 425 V465"/><path class="a" d="M475 425 V465"/><path class="a" d="M600 355 H620 V512 H640"/>
  <path class="d" d="M390 235 V270 H1050 V450"/>
  <rect class="q" x="40" y="605" width="1120" height="62" rx="14"/><text class="t" x="65" y="631">예: WHERE day = '2026-10-08' AND amount &gt; 100</text><text class="s" x="65" y="653">manifest 요약·열 bound로 후보 data file을 고른 뒤, 해당 delete/DV를 함께 적용하고 실제 행에서 최종 판정한다.</text>
  <text class="xs" x="600" y="692" text-anchor="middle">통계 Puffin은 선택 사항이다. v3 DV는 Puffin에 저장되지만 metadata JSON의 통계 참조가 아니라 delete manifest가 개별 위치를 추적한다.</text>
</svg>
