<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <title>운영체제 전체 지도</title>
  <desc>응용 프로그램과 하드웨어 사이에서 운영체제가 CPU, 메모리, 장치, 저장장치를 중재하는 구조</desc>
  <defs><style>.b{fill:#eef4ff;stroke:#315b9a;stroke-width:2}.k{fill:#17365d;stroke:#10243e;stroke-width:2}.t{font:18px sans-serif;fill:#17202a}.w{font:18px sans-serif;fill:white}.a{stroke:#526b85;stroke-width:3;marker-end:url(#m)} </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526b85"/></marker></defs>
  <rect class="b" x="250" y="20" width="460" height="60" rx="12"/><text class="t" x="480" y="57" text-anchor="middle">응용 프로그램: 프로세스와 스레드</text>
  <rect class="k" x="90" y="130" width="780" height="100" rx="14"/><text class="w" x="480" y="165" text-anchor="middle">운영체제 커널: 추상화 · 보호 · 정책 · 기작</text><text class="w" x="480" y="202" text-anchor="middle">scheduler · virtual memory · VFS · driver</text>
  <rect class="b" x="40" y="315" width="180" height="60" rx="10"/><rect class="b" x="270" y="315" width="180" height="60" rx="10"/><rect class="b" x="510" y="315" width="180" height="60" rx="10"/><rect class="b" x="740" y="315" width="180" height="60" rx="10"/>
  <text class="t" x="130" y="352" text-anchor="middle">CPU</text><text class="t" x="360" y="352" text-anchor="middle">RAM</text><text class="t" x="600" y="352" text-anchor="middle">장치</text><text class="t" x="830" y="352" text-anchor="middle">저장장치</text>
  <path class="a" d="M480 80V125"/><path class="a" d="M160 230V310"/><path class="a" d="M365 230V310"/><path class="a" d="M595 230V310"/><path class="a" d="M805 230V310"/>
</svg>
