<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img">
  <title>CPU scheduling 시간선</title><desc>FCFS와 round robin quantum 2의 실행 순서를 비교</desc>
  <style>.a{fill:#7fb3d5}.b{fill:#82e0aa}.c{fill:#f7dc6f}.t{font:18px sans-serif}.x{stroke:#333;stroke-width:2}</style>
  <text class="t" x="30" y="55">FCFS</text><text class="t" x="30" y="205">RR q=2</text>
  <rect class="a" x="130" y="20" width="400" height="70"/><rect class="b" x="530" y="20" width="160" height="70"/><rect class="c" x="690" y="20" width="80" height="70"/>
  <text class="t" x="330" y="62" text-anchor="middle">A 5</text><text class="t" x="610" y="62" text-anchor="middle">B 2</text><text class="t" x="730" y="62" text-anchor="middle">C 1</text>
  <rect class="a" x="130" y="170" width="160" height="70"/><rect class="b" x="290" y="170" width="160" height="70"/><rect class="c" x="450" y="170" width="80" height="70"/><rect class="a" x="530" y="170" width="160" height="70"/><rect class="a" x="690" y="170" width="80" height="70"/>
  <text class="t" x="210" y="212" text-anchor="middle">A 2</text><text class="t" x="370" y="212" text-anchor="middle">B 2</text><text class="t" x="490" y="212" text-anchor="middle">C 1</text><text class="t" x="610" y="212" text-anchor="middle">A 2</text><text class="t" x="730" y="212" text-anchor="middle">A 1</text>
  <path class="x" d="M130 280H800"/><text class="t" x="130" y="310">0</text><text class="t" x="770" y="310">8 tick</text>
