<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">TLS 1.3 단순화 핸드셰이크</title><desc id="desc">클라이언트와 서버가 키 교환 값을 교환하고 서버 인증서를 검증한 뒤 Finished 메시지로 transcript를 확인한다.</desc><defs><marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker></defs><rect width="1200" height="760" fill="#f8fafc"/><text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700">TLS 1.3: 키 합의와 인증</text><text x="210" y="100" text-anchor="middle" font-size="25">클라이언트</text><text x="990" y="100" text-anchor="middle" font-size="25">서버</text><path d="M210 120V690M990 120V690" stroke="#64748b" stroke-width="3"/><g stroke="#1d4ed8" stroke-width="4" marker-end="url(#d)"><path d="M220 170H975"/><path d="M980 245H225"/><path d="M980 335H225"/><path d="M980 425H225"/><path d="M220 520H975"/><path d="M220 610H975"/></g><g font-family="sans-serif" font-size="20" text-anchor="middle"><text x="600" y="155">ClientHello: 지원 알고리즘, ECDHE 공개값</text><text x="600" y="230">ServerHello: 선택, ECDHE 공개값</text><text x="600" y="320">Certificate + CertificateVerify</text><text x="600" y="410">Finished: 지금까지의 transcript 확인</text><text x="600" y="505">클라이언트 Finished</text><text x="600" y="595">암호화된 애플리케이션 데이터</text></g><text x="600" y="715" text-anchor="middle" font-size="19">호스트명·체인·유효기간 검증을 생략하면 암호화 연결이어도 원하는 서버인지 알 수 없다.</text></svg>
