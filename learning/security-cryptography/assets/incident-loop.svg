<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">보안 사고 대응 순환</title><desc id="desc">준비, 탐지, 범위 확정, 격리, 복구, 학습이 증거 보존과 함께 순환한다.</desc><defs><marker id="e" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker></defs><rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">사고 대응은 증거를 보존하는 상태 전이</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="90" y="150" width="220" height="95" rx="45" fill="#dbeafe" stroke="#1d4ed8"/><text x="200" y="205">1 준비</text><rect x="490" y="110" width="220" height="95" rx="45" fill="#fef3c7" stroke="#a16207"/><text x="600" y="165">2 탐지·확인</text><rect x="890" y="150" width="220" height="95" rx="45" fill="#fee2e2" stroke="#b91c1c"/><text x="1000" y="205">3 범위·격리</text><rect x="790" y="430" width="220" height="95" rx="45" fill="#dcfce7" stroke="#15803d"/><text x="900" y="485">4 제거·복구</text><rect x="190" y="430" width="220" height="95" rx="45" fill="#ede9fe" stroke="#6d28d9"/><text x="300" y="485">5 회고·개선</text></g><g fill="none" stroke="#334155" stroke-width="4" marker-end="url(#e)"><path d="M310 175L480 155"/><path d="M710 155L880 175"/><path d="M1000 250L925 420"/><path d="M780 478H420"/><path d="M250 425L180 255"/></g><text x="600" y="610" text-anchor="middle" font-size="21">각 전이마다 시간, 근거, 담당자, 변경 내용을 기록해야 나중에 재구성할 수 있다.</text></svg>
