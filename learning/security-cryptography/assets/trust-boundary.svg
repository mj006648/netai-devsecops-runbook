<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">요청이 신뢰 경계를 통과하는 과정</title><desc id="desc">외부 요청이 검증, 인증, 인가, 업무 처리, 감사 기록을 차례로 통과한다.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">요청과 신뢰 경계</text>
<g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="45" y="240" width="180" height="105" rx="16" fill="#fee2e2" stroke="#b91c1c"/><text x="135" y="285">외부 입력</text><text x="135" y="320">아직 불신</text>
<rect x="285" y="240" width="180" height="105" rx="16" fill="#fef3c7" stroke="#a16207"/><text x="375" y="285">형식·크기</text><text x="375" y="320">검증</text>
<rect x="525" y="240" width="180" height="105" rx="16" fill="#dbeafe" stroke="#1d4ed8"/><text x="615" y="285">인증·인가</text><text x="615" y="320">주체·행위</text>
<rect x="765" y="240" width="180" height="105" rx="16" fill="#dcfce7" stroke="#15803d"/><text x="855" y="285">업무 처리</text><text x="855" y="320">최소 권한</text>
<rect x="1005" y="240" width="150" height="105" rx="16" fill="#ede9fe" stroke="#6d28d9"/><text x="1080" y="285">감사 증거</text><text x="1080" y="320">결과 기록</text></g>
<g stroke="#334155" stroke-width="4" marker-end="url(#a)"><path d="M225 292 H280"/><path d="M465 292 H520"/><path d="M705 292 H760"/><path d="M945 292 H1000"/></g>
<path d="M500 150 V470" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/><text x="480" y="500" text-anchor="end" font-size="21" fill="#991b1b">정책이 정의한 신뢰 경계</text><text x="600" y="585" text-anchor="middle" font-size="20">통과했다는 사실은 이후 입력을 무조건 믿으라는 뜻이 아니다. 각 경계가 자기 조건을 다시 검사한다.</text></svg>
