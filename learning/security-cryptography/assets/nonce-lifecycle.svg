<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">AEAD nonce의 수명 관리</title><desc id="desc">키 생성부터 여러 프로세스와 재시작을 거쳐 폐기할 때까지 nonce가 중복되지 않아야 한다.</desc><defs><marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker></defs><rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">키 K 아래 nonce 공간</text><g font-family="sans-serif" font-size="20" text-anchor="middle"><rect x="50" y="210" width="190" height="110" rx="14" fill="#dbeafe" stroke="#1d4ed8"/><text x="145" y="255">키 K 생성</text><text x="145" y="290">카운터 0</text><rect x="300" y="160" width="190" height="110" rx="14" fill="#dcfce7" stroke="#15803d"/><text x="395" y="205">프로세스 A</text><text x="395" y="240">0, 1, 2</text><rect x="300" y="350" width="190" height="110" rx="14" fill="#dcfce7" stroke="#15803d"/><text x="395" y="395">프로세스 B</text><text x="395" y="430">3, 4, 5</text><rect x="560" y="250" width="230" height="110" rx="14" fill="#fef3c7" stroke="#a16207"/><text x="675" y="295">영속 등록부</text><text x="675" y="330">재시작 뒤에도 6</text><rect x="860" y="250" width="270" height="110" rx="14" fill="#ede9fe" stroke="#6d28d9"/><text x="995" y="295">키 K 폐기</text><text x="995" y="330">카운터 공간 종료</text></g><g stroke="#334155" stroke-width="4" marker-end="url(#c)"><path d="M240 260L295 220"/><path d="M240 280L295 395"/><path d="M490 215L555 285"/><path d="M490 405L555 325"/><path d="M790 305H855"/></g><text x="600" y="535" text-anchor="middle" font-size="21">유일성 범위는 한 함수 호출이나 한 프로세스가 아니라 “같은 키를 쓰는 모든 암호화”다.</text></svg>
