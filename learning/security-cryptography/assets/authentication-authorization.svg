<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">인증, 인가, Admission 단계</title><desc id="desc">토큰으로 주체를 확인하고 정책으로 행위를 판단한 뒤 객체 자체를 검사한다.</desc><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker></defs><rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">API 요청의 세 가지 판정</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="70" y="180" width="260" height="170" rx="18" fill="#dbeafe" stroke="#1d4ed8"/><text x="200" y="225" font-weight="700">1. 인증</text><text x="200" y="270">“누구인가?”</text><text x="200" y="310">인증서·토큰 검증</text><rect x="470" y="180" width="260" height="170" rx="18" fill="#dcfce7" stroke="#15803d"/><text x="600" y="225" font-weight="700">2. 인가</text><text x="600" y="270">“해도 되는가?”</text><text x="600" y="310">주체·동사·자원 정책</text><rect x="870" y="180" width="260" height="170" rx="18" fill="#fef3c7" stroke="#a16207"/><text x="1000" y="225" font-weight="700">3. Admission</text><text x="1000" y="270">“객체가 안전한가?”</text><text x="1000" y="310">변경·검증 정책</text></g><g stroke="#334155" stroke-width="4" marker-end="url(#b)"><path d="M330 265H465"/><path d="M730 265H865"/></g><text x="600" y="450" text-anchor="middle" font-size="23">모든 단계가 허용해야 저장소의 상태가 바뀐다.</text><text x="600" y="505" text-anchor="middle" font-size="20">인증 성공은 관리자 권한을 뜻하지 않고, RBAC 허용은 안전한 객체를 뜻하지 않는다.</text></svg>
