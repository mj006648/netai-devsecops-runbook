<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">암호 도구의 입력과 보장</title><desc id="desc">해시, MAC, 서명, AEAD가 사용하는 키와 제공하는 핵심 보장을 비교한다.</desc><rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">같아 보이지만 다른 네 도구</text><g font-family="sans-serif" font-size="20"><g transform="translate(70 120)"><rect width="500" height="110" rx="15" fill="#e0f2fe" stroke="#0369a1"/><text x="25" y="38" font-weight="700">해시</text><text x="25" y="70">메시지 → 고정 길이 요약</text><text x="25" y="98">키 없음 · 변조 탐지만 단독으로 보장하지 않음</text></g><g transform="translate(630 120)"><rect width="500" height="110" rx="15" fill="#dcfce7" stroke="#15803d"/><text x="25" y="38" font-weight="700">MAC</text><text x="25" y="70">공유 비밀키 + 메시지 → 태그</text><text x="25" y="98">키를 아는 참여자 사이 무결성·인증</text></g><g transform="translate(70 300)"><rect width="500" height="110" rx="15" fill="#ede9fe" stroke="#6d28d9"/><text x="25" y="38" font-weight="700">전자서명</text><text x="25" y="70">개인키로 서명 · 공개키로 검증</text><text x="25" y="98">서명자와 바이트 무결성, 코드의 무해성은 아님</text></g><g transform="translate(630 300)"><rect width="500" height="110" rx="15" fill="#fef3c7" stroke="#a16207"/><text x="25" y="38" font-weight="700">AEAD</text><text x="25" y="70">키 + nonce + 평문 + AAD → 암호문 + 태그</text><text x="25" y="98">기밀성·무결성, 재전송 방지는 별도</text></g></g><text x="600" y="530" text-anchor="middle" font-size="22">도구 이름보다 “누가 어떤 키를 가지고 무엇을 검증하는가”를 먼저 그린다.</text></svg>
