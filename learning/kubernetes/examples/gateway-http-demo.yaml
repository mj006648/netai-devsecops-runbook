# Educational Gateway API v1.6.2 example; not applied while authoring.
# Requires compatible CRDs, Envoy Gateway controller, and working ingress infrastructure.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-demo-edge
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-demo-app
  labels:
    gateway-demo-access: allowed
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: textbook-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway-demo-edge
spec:
  gatewayClassName: textbook-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.example.test
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-demo-access: allowed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-echo
  template:
    metadata:
      labels:
        app: gateway-echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=app-backend"]
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway-demo-app
spec:
  selector:
    app: gateway-echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-v1
  namespace: gateway-demo-app
spec:
  parentRefs:
    - name: public
      namespace: gateway-demo-edge
      sectionName: http
  hostnames:
    - api.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: echo
          port: 80
