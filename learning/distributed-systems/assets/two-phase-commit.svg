<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">2단계 커밋의 blocking</title><desc id="desc">참여자가 prepare YES 뒤 coordinator 장애로 결정을 기다리는 상황</desc>
<rect width="1200" height="700" fill="#fff7ed"/><g font-family="sans-serif" font-size="27" text-anchor="middle">
<rect x="450" y="60" width="300" height="100" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="4"/><text x="600" y="120">Coordinator</text>
<rect x="100" y="500" width="300" height="100" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="250" y="560">Participant A</text>
<rect x="800" y="500" width="300" height="100" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="950" y="560">Participant B</text>
<text x="250" y="400">YES: 잠금+prepared</text><text x="950" y="400">YES: 잠금+prepared</text><text x="600" y="290" fill="#b91c1c">결정 전 coordinator 장애</text><text x="600" y="660">참여자는 COMMIT/ABORT를 추측할 수 없어 대기</text></g>
<g stroke="#334155" stroke-width="5"><path d="M520 160 L300 480"/><path d="M680 160 L900 480"/></g>
</svg>
