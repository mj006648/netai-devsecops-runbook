<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">분산 시스템의 요청과 복제 경계</title>
<desc id="desc">클라이언트 요청이 리더를 거쳐 두 복제본에 전달되며 한 링크가 지연되는 그림</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#155e75"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="28" text-anchor="middle">
<rect x="60" y="280" width="220" height="100" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="170" y="340">클라이언트</text>
<rect x="430" y="280" width="220" height="100" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="540" y="340">리더 S1</text>
<rect x="850" y="130" width="220" height="100" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><text x="960" y="190">복제본 S2</text>
<rect x="850" y="450" width="220" height="100" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><text x="960" y="510">복제본 S3</text>
</g>
<g stroke="#155e75" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M280 330 H430"/><path d="M650 310 L850 200"/><path d="M650 350 L850 490" stroke-dasharray="16 12"/></g>
<g font-family="sans-serif" font-size="23"><text x="315" y="300">요청</text><text x="710" y="220">로그 복제</text><text x="700" y="455">지연 가능</text></g>
</svg>
