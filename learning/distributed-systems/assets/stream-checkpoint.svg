<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">스트림 체크포인트와 재생</title><desc id="desc">입력 offset과 처리 상태를 함께 저장하고 장애 뒤 그 위치부터 재생하는 흐름</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker></defs><rect width="1200" height="700" fill="#f0fdfa"/>
<g font-family="sans-serif" font-size="26" text-anchor="middle"><rect x="60" y="260" width="240" height="110" rx="16" fill="#ccfbf1"/><text x="180" y="325">Source offset</text><rect x="470" y="260" width="260" height="110" rx="16" fill="#bae6fd"/><text x="600" y="325">Operator state</text><rect x="900" y="100" width="240" height="110" rx="16" fill="#ddd6fe"/><text x="1020" y="165">Checkpoint</text><rect x="900" y="470" width="240" height="110" rx="16" fill="#fef3c7"/><text x="1020" y="535">Sink</text></g>
<g stroke="#0f766e" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M300 315 H470"/><path d="M730 285 L900 190"/><path d="M730 345 L900 500"/><path d="M900 210 L720 260" stroke-dasharray="14 10"/></g>
