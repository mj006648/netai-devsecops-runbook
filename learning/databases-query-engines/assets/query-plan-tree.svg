<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc"><title id="title">구체적인 쿼리 실행 계획 트리</title><desc id="desc">orders 순차 스캔과 customers 인덱스 스캔 결과를 Hash Join한 뒤 Aggregate하는 아래에서 위 방향의 계획</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#374151"/></marker></defs><rect width="820" height="500" fill="#f9fafb"/><g font-family="sans-serif" font-size="18" text-anchor="middle"><g fill="#ecfccb" stroke="#3f6212" stroke-width="2"><rect x="300" y="35" width="220" height="65" rx="8"/><rect x="300" y="160" width="220" height="75" rx="8"/><rect x="45" y="330" width="270" height="95" rx="8"/><rect x="505" y="330" width="270" height="95" rx="8"/></g><text x="410" y="63">Hash Aggregate</text><text x="410" y="86">region별 SUM(amount)</text><text x="410" y="188">Hash Join</text><text x="410" y="214">o.customer_id = c.id</text><text x="180" y="362">Seq Scan orders</text><text x="180" y="388">status='paid' 필터</text><text x="180" y="412">실제 40,000행</text><text x="640" y="362">Index Scan customers_pkey</text><text x="640" y="388">id 키 조회</text><text x="640" y="412">10,000행</text><g stroke="#374151" stroke-width="2" marker-end="url(#a)"><path d="M410 160V105"/><path d="M180 330V275H370V240"/><path d="M640 330V275H450V240"/></g><text x="410" y="470">실행 순서: 잎 연산자 → 조인 → 집계 → 결과</text></g></svg>
