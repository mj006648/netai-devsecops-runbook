<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">페이지와 버퍼 풀 읽기 경로</title><desc id="desc">실행기가 page 42를 요청하고 버퍼 태그 조회, 빈 프레임 선택, 파일 블록 읽기, pin 고정 후 튜플을 반환하는 과정</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="900" height="360" fill="#fff"/><g font-family="sans-serif" font-size="17" text-anchor="middle"><g fill="#eef2ff" stroke="#4338ca" stroke-width="2"><rect x="25" y="70" width="145" height="80" rx="8"/><rect x="205" y="70" width="145" height="80" rx="8"/><rect x="385" y="70" width="145" height="80" rx="8"/><rect x="565" y="70" width="145" height="80" rx="8"/><rect x="745" y="70" width="130" height="80" rx="8"/></g><text x="97" y="102">Seq Scan</text><text x="97" y="127">page 42 요청</text><text x="277" y="102">버퍼 태그</text><text x="277" y="127">relation, fork, 42</text><text x="457" y="102">프레임 7</text><text x="457" y="127">pin=1</text><text x="637" y="102">데이터 파일</text><text x="637" y="127">block 42</text><text x="810" y="102">튜플</text><text x="810" y="127">필터 입력</text><g stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M170 110H200"/><path d="M350 110H380"/><path d="M530 110H560"/><path d="M710 110H740"/></g><text x="450" y="230" font-size="20">cache hit이면 파일 읽기를 건너뛰고 프레임을 pin한다</text><text x="450" y="270">pin은 사용 중인 프레임이 교체되지 않도록 참조 수를 올리는 동작이다</text></g></svg>
