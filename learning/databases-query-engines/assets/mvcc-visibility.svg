<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc"><title id="title">MVCC 튜플 버전 가시성</title><desc id="desc">계좌 행의 이전 버전 xmin 10 xmax 30과 새 버전 xmin 30을 스냅샷의 진행 중 XID 집합으로 판정하는 그림</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="940" height="430" fill="#fff"/><g font-family="sans-serif" font-size="18"><rect x="40" y="55" width="250" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="65" y="88">tuple A/v1: balance=100</text><text x="65" y="120">xmin=10, xmax=30</text><text x="65" y="150">heap page 42 안의 버전</text><rect x="40" y="235" width="250" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="65" y="268">tuple A/v2: balance=80</text><text x="65" y="300">xmin=30, xmax=없음</text><text x="65" y="330">UPDATE가 만든 새 버전</text><rect x="425" y="55" width="455" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="450" y="88">스냅샷 S_before: xmax=31, in_progress={30}</text><text x="450" y="120">XID 30은 아직 진행 중 → v1 보임, v2 안 보임</text><rect x="425" y="235" width="455" height="120" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="450" y="268">스냅샷 S_after: xmax=31, in_progress={ }</text><text x="450" y="300">XID 30 commit 확인 → v1 숨김, v2 보임</text><g stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M290 115H420"/><path d="M290 295H420"/></g><text x="470" y="405" text-anchor="middle">XID 숫자 하나가 아니라 스냅샷 경계·진행 집합·commit 상태를 함께 본다</text></g></svg>
