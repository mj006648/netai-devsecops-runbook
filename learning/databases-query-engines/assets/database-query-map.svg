<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">데이터베이스 쿼리 처리 전체 지도</title><desc id="desc">SQL 입력이 파서, 계획기, 실행기를 거쳐 버퍼 풀과 페이지를 읽고 결과와 WAL을 만드는 흐름</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#345"/></marker></defs>
<rect width="960" height="360" fill="#f8fafc"/><g font-family="sans-serif" font-size="18" text-anchor="middle"><g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="30" y="55" width="135" height="70" rx="10"/><rect x="210" y="55" width="135" height="70" rx="10"/><rect x="390" y="55" width="135" height="70" rx="10"/><rect x="570" y="55" width="135" height="70" rx="10"/><rect x="750" y="55" width="170" height="70" rx="10"/></g><text x="97" y="85">SQL 문자열</text><text x="97" y="108">SELECT …</text><text x="277" y="85">파서·바인더</text><text x="277" y="108">이름·타입 확인</text><text x="457" y="85">계획기</text><text x="457" y="108">연산자 트리</text><text x="637" y="85">실행기</text><text x="637" y="108">행·벡터 처리</text><text x="835" y="85">결과 행</text><text x="835" y="108">또는 오류</text><g stroke="#345" stroke-width="2" marker-end="url(#a)"><path d="M165 90H205"/><path d="M345 90H385"/><path d="M525 90H565"/><path d="M705 90H745"/></g><rect x="390" y="210" width="170" height="75" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="630" y="210" width="170" height="75" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="475" y="240">버퍼 풀</text><text x="475" y="265">8 KiB 페이지 사본</text><text x="715" y="240">데이터 파일·WAL</text><text x="715" y="265">영구 바이트</text><path d="M635 125V175H475V205" fill="none" stroke="#345" stroke-width="2" marker-end="url(#a)"/><path d="M560 247H625" stroke="#345" stroke-width="2" marker-end="url(#a)"/></g></svg>
