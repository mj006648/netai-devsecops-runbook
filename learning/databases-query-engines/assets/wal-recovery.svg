<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" role="img" aria-labelledby="title desc"><title id="title">WAL 선행 기록과 충돌 복구</title><desc id="desc">UPDATE가 WAL LSN 11과 dirty page를 만들고 WAL을 먼저 내구화한 뒤 충돌 후 page LSN 10에 redo하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="940" height="390" fill="#f8fafc"/><g font-family="sans-serif" font-size="17" text-anchor="middle"><g fill="#fee2e2" stroke="#b91c1c" stroke-width="2"><rect x="25" y="65" width="150" height="80" rx="8"/><rect x="215" y="65" width="170" height="80" rx="8"/><rect x="425" y="65" width="170" height="80" rx="8"/><rect x="635" y="65" width="150" height="80" rx="8"/><rect x="805" y="65" width="110" height="80" rx="8"/></g><text x="100" y="97">UPDATE</text><text x="100" y="122">50 → 60</text><text x="300" y="97">WAL buffer</text><text x="300" y="122">LSN 11</text><text x="510" y="97">WAL 저장장치</text><text x="510" y="122">먼저 flush</text><text x="710" y="97">COMMIT 확인</text><text x="710" y="122">페이지는 dirty 가능</text><text x="860" y="97">crash</text><text x="860" y="122">메모리 소실</text><g stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M175 105H210"/><path d="M385 105H420"/><path d="M595 105H630"/><path d="M785 105H800"/></g><rect x="185" y="245" width="220" height="85" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="540" y="245" width="220" height="85" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="295" y="277">디스크 page 42</text><text x="295" y="305">value=50, pageLSN=10</text><text x="650" y="277">redo LSN 11</text><text x="650" y="305">value=60, pageLSN=11</text><path d="M860 145V205H650V240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M405 287H535" stroke="#334155" stroke-width="2" marker-end="url(#a)"/></g></svg>
