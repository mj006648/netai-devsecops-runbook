<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc"><title id="title">열 지향 저장과 벡터 실행</title><desc id="desc">orders의 amount 열만 읽어 1024개 값 벡터에 필터 마스크를 만들고 선택된 값의 합을 구하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="920" height="400" fill="#fff"/><g font-family="sans-serif" font-size="17" text-anchor="middle"><g fill="#cffafe" stroke="#0e7490" stroke-width="2"><rect x="30" y="60" width="180" height="120" rx="8"/><rect x="260" y="60" width="180" height="120" rx="8"/><rect x="490" y="60" width="180" height="120" rx="8"/><rect x="720" y="60" width="170" height="120" rx="8"/></g><text x="120" y="92">Parquet/Iceberg</text><text x="120" y="120">amount column chunk</text><text x="120" y="148">min=5, max=900</text><text x="350" y="92">decode vector</text><text x="350" y="120">1024개 amount</text><text x="350" y="148">연속 배열</text><text x="580" y="92">filter mask</text><text x="580" y="120">amount &gt; 100</text><text x="580" y="148">0,1,1,0,…</text><text x="805" y="92">SUM 연산자</text><text x="805" y="120">선택 값 누적</text><text x="805" y="148">부분 합</text><g stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M210 120H255"/><path d="M440 120H485"/><path d="M670 120H715"/></g><text x="460" y="255" font-size="20">행 전체를 만들지 않고 필요한 열의 묶음을 반복 처리한다</text><text x="460" y="300">row group 통계가 조건과 겹치지 않으면 그 묶음은 읽기 전에 건너뛸 수 있다</text><text x="460" y="345">압축·인코딩·CPU 캐시 효과는 데이터 분포와 연산자에 따라 달라진다</text></g></svg>
