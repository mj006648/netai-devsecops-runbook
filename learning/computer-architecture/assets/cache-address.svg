<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">캐시 주소를 태그·묶음·위치로 분해하기</title>
<desc id="desc">32비트 주소 0x1234를 4KiB 64바이트 2-way 캐시의 태그 2, 묶음 8, 위치 52로 나눈다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">캐시 주소를 태그·묶음·위치로 분해하기</text>
<text x="60" y="100" font-size="24" text-anchor="start" fill="#172554">예시 캐시: 총 4 KiB · 한 줄 64 B · 한 묶음에 2자리(2-way)</text><text x="60" y="145" font-size="22" text-anchor="start" fill="#172554">전체 64줄 ÷ 2자리 = 32묶음 → 묶음 번호 5비트, 줄 내부 위치 6비트</text><rect x="60" y="185" width="630" height="110" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="375.0" y="231.33333333333334" font-size="22" text-anchor="middle" fill="#172554">태그(tag): 상위 21비트 [31:11]</text><text x="375.0" y="263.33333333333337" font-size="22" text-anchor="middle" fill="#172554">같은 묶음에 들어온 블록 구별</text><rect x="690" y="185" width="225" height="110" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="802.5" y="231.33333333333334" font-size="22" text-anchor="middle" fill="#172554">묶음 번호</text><text x="802.5" y="263.33333333333337" font-size="22" text-anchor="middle" fill="#172554">5비트 [10:6]</text><rect x="915" y="185" width="225" height="110" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="1027.5" y="231.33333333333334" font-size="22" text-anchor="middle" fill="#172554">줄 내부 위치</text><text x="1027.5" y="263.33333333333337" font-size="22" text-anchor="middle" fill="#172554">6비트 [5:0]</text><text x="60" y="345" font-size="24" text-anchor="start" fill="#172554">32비트 바이트 주소 0x1234 = 4660 = 2×2048 + 8×64 + 52</text><path d="M803 295 L803 380" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="390" width="480" height="155" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="300.0" y="442.1666666666667" font-size="23" text-anchor="middle" fill="#172554">태그=2 · 묶음=8 · 내부 위치=52</text><text x="300.0" y="475.1666666666667" font-size="23" text-anchor="middle" fill="#172554">줄 시작: 0x1200</text><text x="300.0" y="508.1666666666667" font-size="23" text-anchor="middle" fill="#172554">요청 바이트는 그 줄의 53번째</text><rect x="635" y="390" width="505" height="155" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="887.5" y="442.8333333333333" font-size="22" text-anchor="middle" fill="#172554">8번 묶음의 두 자리에서 태그 비교</text><text x="887.5" y="474.8333333333333" font-size="22" text-anchor="middle" fill="#172554">유효한 태그 2가 있으면 적중(hit)</text><text x="887.5" y="506.8333333333333" font-size="22" text-anchor="middle" fill="#172554">없으면 다음 계층에서 줄을 가져옴</text><text x="60" y="600" font-size="22" text-anchor="start" fill="#172554">0x1A34도 묶음 8·위치 52지만 태그는 3이다. 주소 전체가 같은 것은 아니다.</text><text x="60" y="650" font-size="22" text-anchor="start" fill="#172554">주소 폭·인덱스 방식·용량은 교육용 가정이다. 실제 제품은 구조가 다를 수 있다.</text>
</g>
</svg>
