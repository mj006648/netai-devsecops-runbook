<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Roofline: 계산량과 전송량을 함께 보는 상한</title>
<desc id="desc">50GB/s와 200GFLOP/s의 단순 모델에서 연산 집약도 4FLOP/B를 경계로 메모리 상한과 연산 상한이 만난다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="740" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">Roofline: 계산량과 전송량을 함께 보는 상한</text>
<text x="60" y="100" font-size="22" text-anchor="start" fill="#172554">교육용 상한: 연산 200 GFLOP/s, 메모리 50 GB/s · 겹침·대역폭 가정을 단순화</text><path d="M150 520 L1060 520" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M150 520 L150 145" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="170" y="160" font-size="22" text-anchor="start" fill="#172554">성능 GFLOP/s</text><text x="1060" y="560" font-size="22" text-anchor="end" fill="#172554">연산 집약도 FLOP/B</text><path d="M150 520L550 220H1010" fill="none" stroke="#16a34a" stroke-width="5"/><text x="755" y="195" font-size="23" text-anchor="middle" fill="#172554">계산 상한 200</text><text x="335" y="335" font-size="23" text-anchor="middle" fill="#172554">50 × 집약도</text><text x="250" y="550" font-size="22" text-anchor="middle" fill="#172554">1</text><text x="550" y="550" font-size="22" text-anchor="middle" fill="#172554">4</text><text x="950" y="550" font-size="22" text-anchor="middle" fill="#172554">8</text><text x="120" y="450" font-size="22" text-anchor="end" fill="#172554">50</text><text x="120" y="230" font-size="22" text-anchor="end" fill="#172554">200</text><circle cx="250" cy="445" r="8" fill="#2563eb"/><circle cx="950" cy="220" r="8" fill="#2563eb"/><text x="335" y="480" font-size="22" text-anchor="middle" fill="#172554">1 FLOP/B → 최대 50</text><text x="925" y="280" font-size="22" text-anchor="middle" fill="#172554">8 FLOP/B → 최대 200</text><rect x="60" y="600" width="1080" height="95" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="600.0" y="638.8333333333334" font-size="22" text-anchor="middle" fill="#172554">상한 = min(연산 상한, 메모리 대역폭 × 연산 집약도). 꺾이는 지점은 200/50=4 FLOP/B.</text><text x="600.0" y="670.8333333333334" font-size="22" text-anchor="middle" fill="#172554">실제 성능은 이보다 낮을 수 있다. 캐시·명령·동기화·실측 대역폭 조건을 함께 확인한다.</text>
</g>
</svg>
