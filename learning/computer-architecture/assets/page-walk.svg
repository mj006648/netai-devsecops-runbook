<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">TLB miss와 page fault는 다른 사건</title>
<desc id="desc">페이지 크기 4096바이트에서 가상 주소를 나누고 TLB 적중, 페이지 탐색, 페이지 폴트의 경로를 구분한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">TLB miss와 page fault는 다른 사건</text>
<rect x="40" y="105" width="310" height="100" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="195.0" y="146.16666666666666" font-size="23" text-anchor="middle" fill="#172554">가상 주소 9000</text><text x="195.0" y="179.16666666666666" font-size="23" text-anchor="middle" fill="#172554">페이지=2 · 위치=808</text><rect x="420" y="105" width="310" height="100" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="575.0" y="146.16666666666666" font-size="23" text-anchor="middle" fill="#172554">TLB: 주소 변환 캐시</text><text x="575.0" y="179.16666666666666" font-size="23" text-anchor="middle" fill="#172554">페이지 2의 변환 찾기</text><rect x="820" y="105" width="340" height="100" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="990.0" y="146.16666666666666" font-size="23" text-anchor="middle" fill="#172554">적중 + 접근 허용</text><text x="990.0" y="179.16666666666666" font-size="23" text-anchor="middle" fill="#172554">프레임 7을 바로 사용</text><path d="M350 155 L410 155" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 155 L810 155" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M575 205 L575 290" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="605" y="260" font-size="22" text-anchor="start" fill="#172554">TLB miss</text><rect x="365" y="300" width="420" height="110" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="575.0" y="346.1666666666667" font-size="23" text-anchor="middle" fill="#172554">페이지 테이블 탐색(page walk)</text><text x="575.0" y="379.1666666666667" font-size="23" text-anchor="middle" fill="#172554">존재 여부·권한·프레임 확인</text><rect x="35" y="470" width="500" height="115" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="285.0" y="518.6666666666666" font-size="23" text-anchor="middle" fill="#172554">존재하고 접근 허용: 프레임 7</text><text x="285.0" y="551.6666666666666" font-size="23" text-anchor="middle" fill="#172554">물리 주소 = 7×4096+808 = 29480</text><rect x="665" y="470" width="495" height="115" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="912.5" y="518.6666666666666" font-size="23" text-anchor="middle" fill="#172554">없거나 접근이 허용되지 않음</text><text x="912.5" y="551.6666666666666" font-size="23" text-anchor="middle" fill="#172554">page fault → OS가 처리·거부</text><path d="M455 410 L300 460" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 410 L890 460" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="640" font-size="22" text-anchor="start" fill="#172554">TLB miss만으로 page fault가 되는 것은 아니다. TLB 적중 때도 권한 위반은 가능하다.</text>
</g>
</svg>
