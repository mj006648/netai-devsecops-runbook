<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">캐시 일관성: 값이 아니라 줄의 권한을 추적</title>
<desc id="desc">교육용 MESI 상태 변화로 두 코어의 읽기와 쓰기 권한, false sharing의 줄 단위를 설명한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">캐시 일관성: 값이 아니라 줄의 권한을 추적</text>
<text x="60" y="100" font-size="23" text-anchor="start" fill="#172554">두 코어의 캐시에 같은 64바이트 줄이 있다고 가정한 MESI 교육 모형</text><text x="65" y="160" font-size="24" text-anchor="start" fill="#172554" font-weight="700">시간·사건</text><text x="470" y="160" font-size="24" text-anchor="start" fill="#172554" font-weight="700">코어 A의 줄</text><text x="875" y="160" font-size="24" text-anchor="start" fill="#172554" font-weight="700">코어 B의 줄</text><text x="65" y="230" font-size="22" text-anchor="start" fill="#172554">0. 아직 줄이 없음</text><rect x="440" y="195" width="300" height="65" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="590.0" y="234.83333333333334" font-size="22" text-anchor="middle" fill="#172554">I: 무효</text><rect x="840" y="195" width="300" height="65" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="990.0" y="234.83333333333334" font-size="22" text-anchor="middle" fill="#172554">I: 무효</text><text x="65" y="312" font-size="22" text-anchor="start" fill="#172554">1. A가 값을 씀</text><rect x="440" y="277" width="300" height="65" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="590.0" y="316.8333333333333" font-size="22" text-anchor="middle" fill="#172554">M: 수정·단독</text><rect x="840" y="277" width="300" height="65" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="990.0" y="316.8333333333333" font-size="22" text-anchor="middle" fill="#172554">I: 무효</text><text x="65" y="394" font-size="22" text-anchor="start" fill="#172554">2. B가 값을 읽음</text><rect x="440" y="359" width="300" height="65" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="590.0" y="398.8333333333333" font-size="22" text-anchor="middle" fill="#172554">S: 공유</text><rect x="840" y="359" width="300" height="65" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="990.0" y="398.8333333333333" font-size="22" text-anchor="middle" fill="#172554">S: 공유</text><text x="65" y="476" font-size="22" text-anchor="start" fill="#172554">3. B가 쓰기 권한 요청</text><rect x="440" y="441" width="300" height="65" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="590.0" y="480.8333333333333" font-size="22" text-anchor="middle" fill="#172554">I: 무효화</text><rect x="840" y="441" width="300" height="65" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="990.0" y="480.8333333333333" font-size="22" text-anchor="middle" fill="#172554">M: 수정·단독</text><path d="M840 475 L750 475" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="780" y="540" font-size="22" text-anchor="middle" fill="#172554">A의 복사본을 무효화한 뒤 B가 수정</text><rect x="60" y="575" width="1080" height="95" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="600.0" y="613.8333333333334" font-size="22" text-anchor="middle" fill="#172554">false sharing: 서로 다른 변수라도 같은 줄에 놓이면 줄의 쓰기 권한을 주고받을 수 있다.</text><text x="600.0" y="645.8333333333334" font-size="22" text-anchor="middle" fill="#172554">E는 깨끗한 단독 복사본이다. 실제 프로토콜의 상태·전송·응답은 제품마다 다르다.</text>
</g>
</svg>
