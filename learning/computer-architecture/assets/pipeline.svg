<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">파이프라인의 load-use 의존성과 한 주기 대기</title>
<desc id="desc">일곱 주기의 표에서 LOAD 결과를 기다리는 ADD와 데이터 전달 방향을 표시한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">파이프라인의 load-use 의존성과 한 주기 대기</text>
<text x="50" y="95" font-size="23" text-anchor="start" fill="#172554">5단계: IF 가져오기 · ID 해석 · EX 실행 · MEM 메모리 · WB 결과 기록</text><text x="330" y="155" font-size="22" text-anchor="middle" fill="#172554" font-weight="700">1주기</text><text x="445" y="155" font-size="22" text-anchor="middle" fill="#172554" font-weight="700">2주기</text><text x="560" y="155" font-size="22" text-anchor="middle" fill="#172554" font-weight="700">3주기</text><text x="675" y="155" font-size="22" text-anchor="middle" fill="#172554" font-weight="700">4주기</text><text x="790" y="155" font-size="22" text-anchor="middle" fill="#172554" font-weight="700">5주기</text><text x="905" y="155" font-size="22" text-anchor="middle" fill="#172554" font-weight="700">6주기</text><text x="1020" y="155" font-size="22" text-anchor="middle" fill="#172554" font-weight="700">7주기</text><text x="35" y="250" font-size="20" text-anchor="start" fill="#172554">LOAD R1, [R2]</text><rect x="280" y="205" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="332.5" y="249.16666666666666" font-size="20" text-anchor="middle" fill="#172554">IF</text><rect x="395" y="205" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="447.5" y="249.16666666666666" font-size="20" text-anchor="middle" fill="#172554">ID</text><rect x="510" y="205" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="562.5" y="249.16666666666666" font-size="20" text-anchor="middle" fill="#172554">EX</text><rect x="625" y="205" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="677.5" y="249.16666666666666" font-size="20" text-anchor="middle" fill="#172554">MEM</text><rect x="740" y="205" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="792.5" y="249.16666666666666" font-size="20" text-anchor="middle" fill="#172554">WB</text><rect x="855" y="205" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="907.5" y="249.16666666666666" font-size="20" text-anchor="middle" fill="#172554">—</text><rect x="970" y="205" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="1022.5" y="249.16666666666666" font-size="20" text-anchor="middle" fill="#172554">—</text><text x="35" y="355" font-size="20" text-anchor="start" fill="#172554">ADD R3, R1, R4</text><rect x="280" y="310" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="332.5" y="354.1666666666667" font-size="20" text-anchor="middle" fill="#172554">—</text><rect x="395" y="310" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="447.5" y="354.1666666666667" font-size="20" text-anchor="middle" fill="#172554">IF</text><rect x="510" y="310" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="562.5" y="354.1666666666667" font-size="20" text-anchor="middle" fill="#172554">ID</text><rect x="625" y="310" width="105" height="75" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="677.5" y="354.1666666666667" font-size="20" text-anchor="middle" fill="#172554">ID 대기</text><rect x="740" y="310" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="792.5" y="354.1666666666667" font-size="20" text-anchor="middle" fill="#172554">EX</text><rect x="855" y="310" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="907.5" y="354.1666666666667" font-size="20" text-anchor="middle" fill="#172554">MEM</text><rect x="970" y="310" width="105" height="75" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="1022.5" y="354.1666666666667" font-size="20" text-anchor="middle" fill="#172554">WB</text><path d="M670 282 L790 305" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="420" font-size="24" text-anchor="middle" fill="#172554">4주기 끝에 읽은 값을 5주기 EX로 전달</text><rect x="60" y="470" width="1080" height="125" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="600.0" y="507.8333333333333" font-size="22" text-anchor="middle" fill="#172554">LOAD 결과는 메모리 읽기가 끝나야 생긴다. ADD는 그 결과가 필요하다.</text><text x="600.0" y="539.8333333333333" font-size="22" text-anchor="middle" fill="#172554">이 교육용 구조에서는 한 주기 기다리고 전달(forwarding)하면 진행할 수 있다.</text><text x="600.0" y="571.8333333333333" font-size="22" text-anchor="middle" fill="#172554">다른 파이프라인·메모리 지연에서는 필요한 대기 주기가 달라진다.</text><text x="60" y="650" font-size="22" text-anchor="start" fill="#172554">대기 때 ID를 유지하고 EX에는 빈 작업을 넣는 상황을 단순화해 표시했다.</text>
</g>
</svg>
