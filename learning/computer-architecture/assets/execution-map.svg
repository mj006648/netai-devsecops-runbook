<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">명령 한 개의 실행과 결과 확정</title>
<desc id="desc">명령 가져오기와 해석, 입력 레지스터, 연산 결과, 프로그램 순서의 확정 단계를 구분한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<g font-family="Noto Sans CJK KR, sans-serif">
<text x="600" y="48" font-size="30" text-anchor="middle" fill="#172554" font-weight="700">명령 한 개의 실행과 결과 확정</text>
<rect x="40" y="100" width="210" height="120" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="145.0" y="151.0" font-size="24" text-anchor="middle" fill="#172554">RAM의 프로그램</text><text x="145.0" y="185.0" font-size="24" text-anchor="middle" fill="#172554">명령과 데이터</text><rect x="330" y="100" width="210" height="120" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="435.0" y="151.0" font-size="24" text-anchor="middle" fill="#172554">명령 가져오기</text><text x="435.0" y="185.0" font-size="24" text-anchor="middle" fill="#172554">PC가 위치 지정</text><rect x="620" y="100" width="240" height="120" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="740.0" y="151.0" font-size="24" text-anchor="middle" fill="#172554">명령 해석·준비</text><text x="740.0" y="185.0" font-size="24" text-anchor="middle" fill="#172554">레지스터 값 읽기</text><rect x="940" y="100" width="220" height="120" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="1050.0" y="151.0" font-size="24" text-anchor="middle" fill="#172554">실행 장치</text><text x="1050.0" y="185.0" font-size="24" text-anchor="middle" fill="#172554">덧셈·주소 계산</text><path d="M250 160 L320 160" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 160 L610 160" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M860 160 L930 160" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="330" width="430" height="150" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="305.0" y="380.3333333333333" font-size="22" text-anchor="middle" fill="#172554">교육 예: ADD R3, R1, R2</text><text x="305.0" y="412.3333333333333" font-size="22" text-anchor="middle" fill="#172554">입력 R1=2, R2=3</text><text x="305.0" y="444.3333333333333" font-size="22" text-anchor="middle" fill="#172554">덧셈 결과 R3 후보=5</text><rect x="650" y="330" width="460" height="150" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="880.0" y="380.3333333333333" font-size="22" text-anchor="middle" fill="#172554">완료한 결과와 예외 확인</text><text x="880.0" y="412.3333333333333" font-size="22" text-anchor="middle" fill="#172554">프로그램 순서대로 은퇴(retire)</text><text x="880.0" y="444.3333333333333" font-size="22" text-anchor="middle" fill="#172554">확정 상태: R3=5, 다음 PC</text><path d="M1050 220 L1050 320" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M520 405 L640 405" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="555" font-size="24" text-anchor="start" fill="#172554">비순차 CPU에서는 실행 완료와 프로그램 순서의 확정이 다른 단계다.</text><text x="60" y="605" font-size="22" text-anchor="start" fill="#172554">ISA: 프로그램에 보이는 명령 약속 / 마이크로아키텍처: 그 약속을 구현하는 내부 구조</text><text x="60" y="655" font-size="22" text-anchor="start" fill="#172554">그림은 교육용 역할 지도이며 특정 제조사의 배선·단계 수를 뜻하지 않는다.</text>
</g>
</svg>
