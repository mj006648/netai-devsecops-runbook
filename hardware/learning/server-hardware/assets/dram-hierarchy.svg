<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1170" role="img" aria-labelledby="title desc">
<title id="title">DIMM을 확대해서 읽는 메모리 계층</title><desc id="desc">전형적인 DDR4 비ECC 64비트 조직으로 CPU 채널, DIMM, 랭크, DRAM 장치, 뱅크 그룹, 뱅크, 행과 열의 관계를 설명한다. DDR5의 서브채널과 GPU 뱅크는 별도 구조다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#48627b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Baekmuk Dotum",sans-serif;fill:#122b45}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:19px}.box{stroke:#7294b5;stroke-width:2;rx:12}.link{stroke:#48627b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="100%" height="100%" fill="#f7fafc"/><text x="40" y="52" class="title">메모리를 밖에서 안으로 확대하기</text><text x="40" y="90" class="note">물리 연결 → 선택 단위 → 칩 내부 조직. 서로 다른 계층을 같은 수로 세지 않습니다.</text><rect class="box" x="40" y="125" width="370" height="92" fill="#e7f0fc"/><text x="60" y="165" class="label">CPU 메모리 컨트롤러</text><text x="445" y="160" class="body">읽기·쓰기 요청을 받아 DRAM 명령의 순서와 시간을 정합니다.</text><path class="link" d="M 225 217 L 225 243"/><rect class="box" x="40" y="249" width="370" height="92" fill="#e7f0fc"/><text x="60" y="289" class="label">채널  Channel</text><text x="445" y="284" class="body">CPU와 메모리 사이의 데이터 경로입니다.</text>
<text x="445" y="314" class="body">같은 채널에 DIMM 둘이 연결돼도 선이 두 배 생기지 않습니다.</text><path class="link" d="M 225 341 L 225 367"/><rect class="box" x="40" y="373" width="370" height="92" fill="#e7f0fc"/><text x="60" y="413" class="label">DIMM  메모리 모듈</text><text x="445" y="408" class="body">메인보드 슬롯에 꽂는 기판입니다.</text>
<text x="445" y="438" class="body">슬롯 = 커넥터 / DIMM = 꽂는 모듈</text><path class="link" d="M 225 465 L 225 491"/><rect class="box" x="40" y="497" width="370" height="92" fill="#e5f4ef"/><text x="60" y="537" class="label">Rank  랭크</text><text x="445" y="532" class="body">함께 선택돼 데이터 폭을 제공하는 DRAM 장치 묶음입니다.</text>
<text x="445" y="562" class="body">DDR4 x64 예: x8 장치 8개가 한 랭크의 64비트를 담당</text><path class="link" d="M 225 589 L 225 615"/><rect class="box" x="40" y="621" width="370" height="92" fill="#e5f4ef"/><text x="60" y="661" class="label">DRAM 장치 / 패키지</text><text x="445" y="656" class="body">검은 패키지 안에 실제 반도체 다이가 있습니다.</text>
<text x="445" y="686" class="body">적층 다이가 있을 수 있어 사진의 칩 수만으로 랭크를 확정하지 않습니다.</text><path class="link" d="M 225 713 L 225 739"/><rect class="box" x="40" y="745" width="370" height="92" fill="#e5f4ef"/><text x="60" y="785" class="label">Bank group → Bank</text><text x="445" y="780" class="body">칩 안의 뱅크 묶음과 독립적인 행 상태를 관리하는 구역입니다.</text>
<text x="445" y="810" class="body">다른 뱅크에서 준비를 겹쳐도 바깥 데이터 경로는 공유할 수 있습니다.</text><path class="link" d="M 225 837 L 225 863"/><rect class="box" x="40" y="869" width="370" height="92" fill="#e5f4ef"/><text x="60" y="909" class="label">Row → Column → Cell</text><text x="445" y="904" class="body">행을 열어 감지 회로에 유지하고 열을 골라 읽거나 씁니다.</text>
<text x="445" y="934" class="body">셀은 전하로 값을 저장하며 주기적인 refresh가 필요합니다.</text><rect class="box" x="40" y="1010" width="1180" height="125" fill="#fff4df"/><text x="60" y="1043" class="note">사진의 앞면·뒷면 = 랭크 수가 아닙니다. x8 = 데이터 폭이지 8GB 용량이 아닙니다.</text>
<text x="60" y="1073" class="note">DDR5의 2 × 32비트 서브채널은 별도 설명이 필요합니다.</text>
<text x="60" y="1103" class="note">GPU shared-memory bank와 분산 학습 rank도 이 그림의 Bank·Rank와 다른 대상입니다.</text></svg>
