<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 960" role="img" aria-labelledby="title desc">
<title id="title">CPU에서 준비한 일을 GPU가 실행하는 과정</title><desc id="desc">위쪽은 호스트와 GPU 커널의 그리드 블록 워프 스레드 실행 관계, 아래쪽은 호스트 DDR와 장치 GDDR HBM 및 SM 내부 공유 메모리와 레지스터의 물리적 위치를 설명한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#48627b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Baekmuk Dotum",sans-serif;fill:#122b45}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:19px}.box{stroke:#7294b5;stroke-width:2;rx:12}.link{stroke:#48627b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="100%" height="100%" fill="#f7fafc"/><text x="40" y="52" class="title">GPU의 실행 단위와 메모리 위치를 나눠 보기</text><text x="40" y="104" class="label">① 누가 일을 준비하고 실행하는가?</text><rect class="box" x="40" y="130" width="340" height="135" fill="#e7f0fc"/><text x="60" y="167" class="label">호스트 CPU</text><text x="60" y="203" class="body">입력 준비·메모리 확보</text>
<text x="60" y="233" class="body">커널 실행 요청</text><rect class="box" x="465" y="130" width="340" height="135" fill="#e7f0fc"/><text x="485" y="167" class="label">그리드 → 블록</text><text x="485" y="203" class="body">이번 실행의 작업 묶음</text>
<text x="485" y="233" class="body">블록을 사용 가능한 SM에 배치</text><rect class="box" x="890" y="130" width="330" height="135" fill="#e5f4ef"/><text x="910" y="167" class="label">SM: 워프 → 스레드</text><text x="910" y="203" class="body">NVIDIA 워프 = 32스레드</text>
<text x="910" y="233" class="body">각 스레드가 자기 원소 계산</text><path class="link" d="M 385 197 L 455 197"/><path class="link" d="M 810 197 L 880 197"/><text x="40" y="314" class="note">예: 1,000개 원소 / 256스레드 블록 → 4블록. 마지막 24개 위치는 배열 경계 확인.</text><text x="40" y="364" class="label">② 계산할 숫자는 어디에 있는가?</text><rect class="box" x="40" y="398" width="350" height="188" fill="#e7f0fc"/><text x="60" y="438" class="label">호스트 RAM</text><text x="60" y="480" class="body">일반 서버에서는 DDR DRAM</text>
<text x="60" y="510" class="body">CPU 프로그램의 입력·버퍼</text>
<text x="60" y="540" class="body">GPU VRAM과 물리 위치가 다름</text><rect class="box" x="670" y="398" width="550" height="188" fill="#e5f4ef"/><text x="695" y="438" class="label">장치 메모리  GDDR / HBM</text><text x="695" y="480" class="body">가중치·활성값·결과를 저장</text>
<text x="695" y="510" class="body">여러 블록에서 접근하는 글로벌 메모리</text>
<text x="695" y="540" class="body">캐시를 거쳐 가까운 저장 공간에서 재사용</text><path class="link" d="M 400 477 L 650 477"/><text x="420" y="443" class="note">입력 이동</text><text x="413" y="522" class="note">PCIe 등 연결</text><rect x="670" y="650" width="550" height="220" rx="15" fill="#fff4df" stroke="#b58b45" stroke-width="2" stroke-dasharray="8 6"/><text x="695" y="690" class="label">GPU 칩의 SM 내부</text><rect class="box" x="690" y="714" width="245" height="110" fill="#fff9ed"/><rect class="box" x="955" y="714" width="245" height="110" fill="#fff9ed"/><text x="710" y="751" class="label">공유 메모리</text><text x="710" y="786" class="note">블록 안에서 공유</text><text x="975" y="751" class="label">레지스터</text><text x="975" y="786" class="note">스레드 실행 상태</text><path class="link" d="M 945 595 L 945 637"/><text x="40" y="680" class="body">공유 메모리 Bank는</text>
<text x="40" y="710" class="body">칩 내부 SRAM 접근 조직입니다.</text>
<text x="40" y="740" class="body">DDR DRAM Bank의</text>
<text x="40" y="770" class="body">행 열기·닫기와 다른 구조입니다.</text><text x="40" y="895" class="note">통합 가상 주소가 물리 메모리의 거리·이동 비용을 없애지는 않습니다.</text></svg>
