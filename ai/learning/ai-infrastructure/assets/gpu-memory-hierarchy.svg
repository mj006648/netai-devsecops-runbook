<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">AI 실행에서 사용하는 메모리 위치와 이동 경로</title>
  <desc id="desc">저장장치의 모델 파일이 CPU RAM을 거쳐 GPU device memory로 이동하고, GPU kernel이 register와 shared memory를 사용하는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.box{rx:14;stroke-width:2}.h{font:700 22px sans-serif;fill:#0f172a}.t{font:16px sans-serif;fill:#334155}.s{font:14px sans-serif;fill:#475569}.a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <text x="500" y="38" text-anchor="middle" class="h">파일에서 GPU 계산까지: 서로 다른 메모리 공간</text>
  <rect class="box" x="40" y="105" width="210" height="170" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="145" y="145" text-anchor="middle" class="h">저장장치</text><text x="145" y="180" text-anchor="middle" class="t">checkpoint 파일</text><text x="145" y="210" text-anchor="middle" class="s">지속 저장 · 느린 접근</text>
  <rect class="box" x="395" y="105" width="210" height="170" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="145" text-anchor="middle" class="h">CPU RAM</text><text x="500" y="180" text-anchor="middle" class="t">host tensor · page</text><text x="500" y="210" text-anchor="middle" class="s">프로세스가 접근</text>
  <rect class="box" x="750" y="70" width="210" height="250" fill="#fef3c7" stroke="#d97706"/>
  <text x="855" y="110" text-anchor="middle" class="h">GPU</text><rect x="775" y="130" width="160" height="65" rx="8" fill="#fde68a" stroke="#b45309"/><text x="855" y="158" text-anchor="middle" class="t">device memory</text><text x="855" y="181" text-anchor="middle" class="s">weight·activation</text>
  <rect x="775" y="220" width="72" height="65" rx="8" fill="#fed7aa" stroke="#c2410c"/><text x="811" y="248" text-anchor="middle" class="s">shared</text><text x="811" y="270" text-anchor="middle" class="s">memory</text>
  <rect x="863" y="220" width="72" height="65" rx="8" fill="#fecaca" stroke="#dc2626"/><text x="899" y="258" text-anchor="middle" class="s">register</text>
  <path class="a" d="M250 180 H390"/><text x="320" y="163" text-anchor="middle" class="s">read</text>
  <path class="a" d="M605 180 H745"/><text x="675" y="150" text-anchor="middle" class="s">PCIe/NVLink</text><text x="675" y="170" text-anchor="middle" class="s">명시/비동기 copy</text>
  <text x="500" y="365" text-anchor="middle" class="t">payload 계산과 실제 예약량은 allocator·정렬·workspace 때문에 다를 수 있다.</text>
</svg>
