<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">가상 주소가 물리 메모리 위치로 변환되는 과정</title>
  <desc id="desc">가상 주소를 페이지 번호와 오프셋으로 나눈 뒤 TLB와 페이지 테이블을 거쳐 물리 프레임 주소를 만드는 흐름</desc>
  <defs>
    <style>
      .box { fill:#f7f9fc; stroke:#375a7f; stroke-width:2; rx:14; }
      .hit { fill:#eaf5ea; stroke:#39814b; stroke-width:2; rx:12; }
      .fault { fill:#fff0f0; stroke:#a23f3f; stroke-width:2; rx:12; }
      .t { font-family:'UnDotum','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:18px; font-weight:600; fill:#17202a; }
      .s { font-family:'UnDotum','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:14px; fill:#34495e; }
      .arrow { stroke:#526777; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#7f8c8d; stroke-width:2; fill:none; stroke-dasharray:7 6; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526777"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="white"/>
  <rect class="box" x="45" y="55" width="210" height="110"/>
  <text class="t" x="150" y="90" text-anchor="middle">1. 가상 주소</text>
  <text class="s" x="150" y="120" text-anchor="middle">가상 페이지 번호 (VPN)</text>
  <text class="s" x="150" y="143" text-anchor="middle">+ 페이지 안 위치</text>

  <rect class="hit" x="350" y="45" width="220" height="125"/>
  <text class="t" x="460" y="80" text-anchor="middle">2. 주소 변환 캐시 (TLB)</text>
  <text class="s" x="460" y="109" text-anchor="middle">최근 변환을 저장한</text>
  <text class="s" x="460" y="132" text-anchor="middle">작은 CPU 캐시</text>
  <text class="s" x="460" y="155" text-anchor="middle">hit → PFN 획득</text>

  <rect class="box" x="350" y="255" width="220" height="125"/>
  <text class="t" x="460" y="290" text-anchor="middle">3. 페이지 테이블</text>
  <text class="s" x="460" y="319" text-anchor="middle">주소 연결 + 권한 표</text>
  <text class="s" x="460" y="342" text-anchor="middle">MMU가 조회</text>
  <text class="s" x="460" y="365" text-anchor="middle">성공 → TLB에 저장</text>

  <rect class="fault" x="350" y="445" width="220" height="80"/>
  <text class="t" x="460" y="478" text-anchor="middle">5. 페이지 폴트</text>
  <text class="s" x="460" y="505" text-anchor="middle">커널이 처리하거나 접근 거부</text>

  <rect class="box" x="680" y="125" width="225" height="125"/>
  <text class="t" x="792" y="160" text-anchor="middle">4. 물리 주소</text>
  <text class="s" x="792" y="189" text-anchor="middle">물리 프레임 번호 (PFN)</text>
  <text class="s" x="792" y="212" text-anchor="middle">+ 같은 페이지 안 위치</text>
  <text class="s" x="792" y="235" text-anchor="middle">→ RAM 접근</text>

  <path class="arrow" d="M255 105 H350"/>
  <path class="arrow" d="M570 105 C640 105 640 160 680 175"/>
  <text class="s" x="620" y="100">TLB hit</text>
  <path class="dash" d="M460 170 V255"/>
  <text class="s" x="478" y="216">TLB miss</text>
  <path class="arrow" d="M570 310 C650 310 630 230 680 205"/>
  <path class="dash" d="M460 380 V445"/>
  <text class="s" x="478" y="418">없음·권한 불일치</text>
  <rect class="box" x="180" y="535" width="600" height="75"/>
  <text class="s" x="480" y="557" text-anchor="middle">범례: VPN = 가상 페이지 번호, PFN = 물리 프레임 번호</text>
  <text class="s" x="480" y="580" text-anchor="middle">MMU = 주소 변환과 접근 권한을 검사하는 CPU 하드웨어</text>
  <text class="s" x="480" y="603" text-anchor="middle">TLB miss는 변환 캐시 부재, page fault는 커널 처리가 필요한 사건이다.</text>
</svg>
