<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Service에서 다른 노드 Pod까지의 데이터 경로</title>
  <desc id="desc">클라이언트 Pod가 Service ClusterIP에 접속할 때 CNI가 만든 인터페이스와 경로, Service 변환, 노드 간 overlay 또는 direct routing을 거쳐 backend Pod로 가는 과정</desc>
  <defs><style>.bg{fill:#f8fafc}.node{fill:#eef2ff;stroke:#4338ca;stroke-width:3}.pod{fill:#ffffff;stroke:#0f766e;stroke-width:2}.svc{fill:#fef3c7;stroke:#a16207;stroke-width:2}.path{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#m)}.dash{stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#m2)}.t{font-family:'DejaVu Sans',sans-serif;font-size:21px;font-weight:700;fill:#0f172a}.s{font-family:'DejaVu Sans',sans-serif;font-size:15px;font-weight:400;fill:#334155}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>
  <rect class="bg" width="1280" height="720" rx="20"/><text class="t" x="45" y="48">Service name → virtual IP → selected backend Pod</text>
  <rect class="node" x="45" y="90" width="500" height="500" rx="18"/><text class="t" x="70" y="128">Node A</text>
  <rect class="pod" x="90" y="175" width="240" height="120" rx="12"/><text class="t" x="125" y="215">client Pod</text><text class="s" x="120" y="245">netns · eth0 · Pod IP</text><text class="s" x="120" y="270">socket → veth</text>
  <rect class="svc" x="110" y="385" width="390" height="115" rx="12"/><text class="t" x="151" y="425">Service translation</text><text class="s" x="145" y="455">ClusterIP:port → backend PodIP:port</text><text class="s" x="145" y="480">iptables / IPVS or Cilium eBPF</text>
  <path class="path" d="M210 295V378"/>
  <rect class="node" x="735" y="90" width="500" height="500" rx="18"/><text class="t" x="760" y="128">Node B</text>
  <rect class="pod" x="900" y="365" width="255" height="135" rx="12"/><text class="t" x="936" y="405">backend Pod</text><text class="s" x="930" y="435">EndpointSlice candidate</text><text class="s" x="930" y="462">veth → socket</text>
  <path class="path" d="M500 442C620 442 700 432 892 432"/>
  <path class="dash" d="M500 535C630 645 760 645 900 535"/>
  <text class="s" x="535" y="420">direct routing: Pod CIDR route</text><text class="s" x="518" y="665">overlay: inner packet inside a VXLAN outer packet</text>
  <rect class="svc" x="460" y="170" width="350" height="100" rx="12"/><text class="t" x="505" y="207">CNI-created foundation</text><text class="s" x="495" y="238">IPAM / veth / routes / datapath state</text>
  <text class="s" x="65" y="635">Cilium: CNI + agent/operator control plane + eBPF programs and maps in the data path.</text>
  <text class="s" x="65" y="690">Hubble shows Cilium-observed flows; it does not prove switch or remote application behavior.</text>
</svg>
